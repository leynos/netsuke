# What builds and runs the proofs rather than what they prove, and the inputs of
# the job's other steps (the scope wrapper's suite and the mutation compile
# gate), which the same decision gates. The contract requires each of these,
# since none can be derived from the Rust source.
infrastructure = [
  ".cargo/",
  ".github/actions/kani-cache/",
  ".github/workflows/ci.yml",
  "Cargo.lock",
  "Cargo.toml",
  "Makefile",
