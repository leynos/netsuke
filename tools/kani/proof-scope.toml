# The paths a Kani proof in this repository can depend on.
#
# `scripts/kani_proof_scope.py` skips the `kani-smoke` proofs on a pull request
# that changes none of these paths; every push to `main` and the nightly
# schedule run them in full. An entry ending in `/` names a directory and
# covers everything beneath it; any other entry names one file.
#
# Do not edit `sources` by guesswork. It is the module closure of the
# `#[kani::proof]` harnesses, which tests/workflow_contracts/kani_proof_scope_test.py
# recomputes from the source on every run: the contract fails when a file the
# harnesses reach is missing here, and when an entry covers a file they cannot
# reach. When it fails, it prints the files to add or remove. See
# docs/adr-039-change-scoped-kani-gate.md for the derivation rules.

[scope]
sources = [
  "locales/",
  "src/ast/",
  "src/cli/command.rs",
