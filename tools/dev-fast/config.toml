# Opt-in Cargo configuration fragment for accelerated local debug builds.
#
# This file is deliberately kept out of `.cargo/config.toml`. Cargo
# auto-discovers that path, and the repository uses it for settings every build
# must have — the Polonius flag. Cranelift and a Linux-only linker are not in
# that category: putting them there would apply them to release packaging,
# coverage, and the formal-verification toolchains, which must keep the
# supported LLVM backend and platform linker. This fragment is instead passed
# explicitly with `cargo --config tools/dev-fast/config.toml ...` from the
# `make dev-*` targets.
#
# The toolchain is the repository's own, from `rust-toolchain.toml`; only the
# mold release is pinned here, in `tools/mold/VERSION`. See
# `docs/developers-guide.md` for the ownership boundary and composition rules.

[unstable]
codegen-backend = true

# Cranelift trades runtime performance for compile speed, so it is applied to
# the dev profile only. `make dev-*` never builds release artefacts.
[profile.dev]
codegen-backend = "cranelift"

# mold ships for Linux only, so the flag is gated behind a target `cfg`. On
# macOS and Windows the table simply does not apply and the platform default
# linker is used; `make dev-fast-check` reports that fallback explicitly rather
# than leaving it implicit.
#
# `-Zpolonius=next` is restated here, not inherited. Cargo picks a single
# rustflags source rather than merging them, and a `[target.*]` table outranks
# the `[build]` table in `.cargo/config.toml`, so naming any flag here drops
# Polonius. The tree only borrow-checks under Polonius (ADR-006), so omitting
# it does not merely diverge from the gate — it fails to compile.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zpolonius=next", "-Clink-arg=-fuse-ld=mold"]
