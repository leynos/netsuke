# Netsuke builds with the Polonius alpha borrow-checking analysis, which is
# enabled by default on nightly toolchains from 2026-08-04 onwards and so is
# nightly-only. The dated pin keeps builds reproducible; see
# docs/adrs/adr-0006-adopt-the-polonius-borrow-checker-on-a-pinned-nightly-toolchain.md before changing the channel.
[toolchain]
channel = "nightly-2026-10-22"
components = ["rustfmt", "clippy", "rust-analyzer"]
