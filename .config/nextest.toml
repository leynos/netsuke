# cargo-nextest configuration for Netsuke.
#
# Scope: this file governs the non-doctest pass of `make test` only. nextest
# does not execute doctests, so those run in a separate `cargo test --doc` pass
# (the `doctest` Make target). Coverage and mutation testing keep their own
# purpose-built runners and are unaffected by this file.
#
# Ownership: this configuration encodes the test-isolation contracts described
# in "Test execution" and "Test isolation utilities" in
# docs/developers-guide.md. Change it alongside that documentation.
#
# Policy: no blanket retries. A test that fails intermittently is a defect to
# diagnose, not to paper over with re-runs. Add a targeted override with a
# written rationale if a genuine external-resource constraint requires one.

[profile.default]
# Surface hangs without failing legitimately slow suites: the documentation
# end-to-end tests shell out to real Ninja and can take tens of seconds. Warn
# after 60s; terminate a test that has run for five warning periods (300s).
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# These tests spawn isolated Cargo builds. Surface their scoped diagnostics in
# CI so a future slow-test warning identifies the responsible subprocess.
filter = 'test(=harness_compiles_under_a_split_build_dir) | test(=packaged_manifest_retains_build_script_sources)'
success-output = "immediate"

[[profile.default.overrides]]
# `harness_compiles_under_a_split_build_dir` on Windows: seven warning periods
# (420s) instead of the default five (300s).
#
# Measured rather than guessed, per the policy above. Across the 58 Windows
# gate runs from the #664 merge (run 33890685806) to run 34064668331 this test
# ran a median of 274.7s and a maximum of 312.9s, the maximum being run
# 33891104448, whose sccache key missed. One run in 58 exceeded the 300s
# default. 420s clears the measured worst case by 34 percent.
#
# The cost is the spawned Cargo build, 98.8 percent of the test's wall time in
# the median: `test_support` depends on `netsuke-build`, so the build compiles
# that crate and roughly 350 dependencies into the private directories the test
# needs for E0460 isolation. The lane's compiler cache does reach that child
# process, because `ci-windows.yml` sets `RUSTC_WRAPPER` at job scope and the
# test adds to the environment rather than clearing it, and it is worth about 3
# percent: 281.0s on the cold run against a 271.9s warm median. There is no
# artefact reuse left to claim.
#
# `packaged_manifest_retains_build_script_sources` is deliberately absent. It
# skips the packaging verification build on Windows and runs it on the Linux
# lane instead (see tests/packaging_smoke_tests.rs), which returns it to the
# default budget with room to spare.
#
# Windows only. On Ubicloud both tests finish in a fraction of the budget, and
# widening the timeout there would blunt the hang detection this file exists to
# provide.
platform = 'cfg(target_os = "windows")'
filter = 'test(=harness_compiles_under_a_split_build_dir)'
slow-timeout = { period = "60s", terminate-after = 7 }
