# cargo-nextest configuration for Netsuke.
#
# Scope: this file governs every `cargo-nextest` invocation, including `cargo
# llvm-cov nextest`. It covers the non-doctest pass of `make test`. nextest does
# not execute doctests, so those remain a separate `cargo test --doc` pass (the
# `doctest` Make target). Mutation testing keeps its own purpose-built runner
# and is unaffected by this file.
#
# Ownership: this configuration encodes the test-isolation contracts described
# in "Test execution" and "Test isolation utilities" in
# docs/developers-guide.md. Change it alongside that documentation.
#
# Policy: no blanket retries. A test that fails intermittently is a defect to
# diagnose, not to paper over with re-runs. Add a targeted override with a
# written rationale if a genuine external-resource constraint requires one.

[profile.default]
# Surface hangs without failing legitimately slow suites: the documentation
# end-to-end tests shell out to real Ninja and can take tens of seconds. Warn
# after 60s; terminate a test that has run for five warning periods (300s).
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups.nested-cargo-builds]
# Child Cargo inherits the coverage lane's four-job build budget. Serialize
# only build-capable child Cargo tests, retaining normal-suite parallelism.
max-threads = 1

[[profile.default.overrides]]
# These tests spawn isolated Cargo builds. Serializing them prevents four
# Nextest workers from each starting a four-job Cargo build on four vCPUs.
filter = 'test(=cli_configuration_fixture_compiles) | test(=harness_compiles_under_a_split_build_dir) | test(=packaged_manifest_retains_build_script_sources)'
test-group = "nested-cargo-builds"
success-output = "immediate"

[[profile.default.overrides]]
filter = 'test(=command_env_embedder_fixture_compiles) | test(=manifest_environment_embedder_fixture_compiles) | test(=policy_from_str_embedder_fixture_compiles_without_clap) | test(=command_list_public_api_fixture_compiles) | test(=ir_gen_error_public_api_fixture_compiles) | test(=legacy_recipe_telemetry_public_api_fixture_compiles) | test(=config_cached_discovery_embedder_fixture_compiles) | test(=verbose_timing_reporter_embedder_fixture_compiles)'
test-group = "nested-cargo-builds"
success-output = "immediate"

[[profile.default.overrides]]
filter = 'test(=production_build_module_slice_has_expected_boundary) | test(=stub_env_default_does_not_compile) | test(=stub_env_builders_compile_under_the_same_harness) | test(=text_domains_cannot_be_swapped) | test(=document_and_needle_compile_together)'
test-group = "nested-cargo-builds"
success-output = "immediate"

[[profile.default.overrides]]
# `harness_compiles_under_a_split_build_dir` on Windows: seven warning periods
# (420s) instead of the default five (300s).
#
# Measured rather than guessed, per the policy above. Across the 58 Windows
# gate runs from the #664 merge (run 33890685806) to run 34064668331 this test
# ran a median of 274.7s and a maximum of 312.9s, the maximum being run
# 33891104448, whose sccache key missed. One run in 58 exceeded the 300s
# default. 420s clears the measured worst case by 34 percent.
#
# The cost is the spawned Cargo build, 98.8 percent of the test's wall time in
# the median: `test_support` depends on `netsuke-build`, so the build compiles
# that crate and roughly 350 dependencies into the private directories the test
# needs for E0460 isolation. The lane's compiler cache does reach that child
# process, because `ci-windows.yml` sets `RUSTC_WRAPPER` at job scope and the
# test adds to the environment rather than clearing it, and it is worth about 3
# percent: 281.0s on the cold run against a 271.9s warm median. There is no
# artefact reuse left to claim.
#
# `packaged_manifest_retains_build_script_sources` is deliberately absent. It
# skips the packaging verification build on Windows and runs it on the Linux
# lane instead (see tests/packaging_smoke_tests.rs), which returns it to the
# default budget with room to spare: 4.2s and 7.6s on runs 34075197897 and
# 34079222917, against a 244.0s median before.
#
# Removing that second Cargo build also unblocked this one. Contention had been
# increasing each test's elapsed time: the two ran concurrently, each with four
# compile jobs on a four-vCPU runner, and each roughly halved the other. With
# the second build gone from the Windows lane, this test took 125.3s, 170.6s
# and 170.7s on the three runs that followed, rather than the 274.7s median
# above. 420s is therefore sized against the older, contended distribution and
# is deliberately conservative while the new shape has three samples.
#
# Trimming the test is worth about 85s, not the 156s that figure implied
# before the second build left. What a trim returns is the test's exclusive
# tail, the period after every other test has reported, measured at 62.3s,
# 87.2s and 85.5s on the three runs after that change, where 156s was the
# implied value of trimming both tests while they contended. The lane fell
# from a 1468s median to about 848s across the three changes, so 85s is
# roughly ten percent of what remains. The repository has decided not to spend
# the fidelity risk on that number yet: the trim is a candidate for tightening
# or deletion at the ten-run revisit gate that the developers' guide defines
# under "Deferring the split-build-dir harness trim". That section also records
# the alternatives already measured and rejected — `cargo check` for
# `cargo build`, warming the compiler cache, and sharing a target directory —
# and the constraints a fixture-crate replacement would have to preserve.
#
# Windows only. On Ubicloud both tests finish in a fraction of the budget, and
# widening the timeout there would blunt the hang detection this file exists to
# provide.
platform = 'cfg(target_os = "windows")'
filter = 'test(=harness_compiles_under_a_split_build_dir)'
slow-timeout = { period = "60s", terminate-after = 7 }

[profile.ci]
# The CI-only profile. It exists solely to carry the whole-run budget, and
# inherits everything else from `default`, including that profile's
# `[[overrides]]`: a nextest profile takes the default table wherever it
# declares nothing of its own.
#
# The coverage lanes select it with `NEXTEST_PROFILE: ci` at job level in
# `ci.yml` and `coverage-main.yml`. The shared `generate-coverage` action
# takes no profile input, so the environment variable is the only lever, and
# tests/workflow_contracts/whole_run_profile_test.py holds each lane to it.
#
# The whole test run, which no per-test budget bounds: a run whose tests each
# stay inside their allowance can still exceed the timers outside nextest
# between them, and the failure then names `cargo` rather than the run.
#
# Measured rather than guessed, per the policy above. Across the ten longest
# coverage steps of each of the last 59 runs of `ci.yml` and
# `coverage-main.yml` on 2026-09-15, the longest nextest run was 452.4s (run
# 34914144521, the pull-request lane) and 320.0s on the trunk lane (run
# 34240220630). Fifteen minutes clears the worst of those by 448s, and no run
# in the sample was ended by any of these timers.
#
# It bounds the instrumented run alone. The uninstrumented `cargo test --doc`
# pass the coverage action runs after it is not a nextest run, so nothing in
# this file bounds it and its own cargo watchdog does.
#
# It also has to sit between its neighbours. It is above the 420s largest
# per-test allowance below it, and the 1,800s cargo watchdog above it covers
# it with 230s to spare: 900s + 70s of termination + a 600s cold build is
# 1,570s. A fifteen-minute margin above the worst measured run, rather than
# the fifteen minutes chosen here, would be 1,352s, above the 1,130s this
# watchdog can cover, so it needs a larger watchdog and then a job ceiling
# above 60 minutes.
#
# Deliberately not in `[profile.default]`, which every local `make test` uses.
# A developer's host is shared and contended in a way CI's is not: measured on
# 2026-09-15, a single `harness_compiles_under_a_split_build_dir` spent 688.6s
# inside its nested `cargo build` waiting on the package-cache lock behind
# other work, where the same test costs seconds unloaded. A whole-run cap in
# `default` would end such a run against a figure sized from CI logs, and the
# figure would be blamed rather than the contention. Local runs keep the
# per-test allowance and no whole-run cap.
#
# See "Test timeouts: the tiers this repository sets" in
# docs/developers-guide.md, which holds the arithmetic and the sample.
global-timeout = "15m"
