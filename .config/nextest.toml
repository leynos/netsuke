# cargo-nextest configuration for Netsuke.
#
# Scope: this file governs every `cargo-nextest` invocation, including `cargo
# llvm-cov nextest`. It covers the non-doctest pass of `make test`. nextest does
# not execute doctests, so those remain a separate `cargo test --doc` pass (the
# `doctest` Make target). Mutation testing keeps its own purpose-built runner
# and is unaffected by this file.
#
# Ownership: this configuration encodes the test-isolation contracts described
# in "Test execution" and "Test isolation utilities" in
# docs/developers-guide.md. Change it alongside that documentation.
#
# Policy: no blanket retries. A test that fails intermittently is a defect to
# diagnose, not to paper over with re-runs. Add a targeted override with a
# written rationale if a genuine external-resource constraint requires one.

[profile.default]
# Surface hangs without failing legitimately slow suites: the documentation
# end-to-end tests shell out to real Ninja and can take tens of seconds. Warn
# after 60s; terminate a test that has run for five warning periods (300s).
#
# This is the profile's own allowance, and it governs every test no override
# matches. The Kani prewarm, negative-compile check, and mutation sweep each
# widen it to fifteen periods, which makes 900 s the largest allowance. Apart
# from those `#[ignore]`d tests, no test in this profile starts a Cargo build:
# ADR-0059 moved compile-time contracts into the build and doctest passes, and
# package verification into `make test-package-verify`.
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups.nested-cargo-builds]
# Child Cargo inherits the coverage lane's four-job build budget. Serialize
# only build-capable child Cargo tests, retaining normal-suite parallelism.
max-threads = 1

# Every filter in this file uses an anchored regex rather than `test(=NAME)`,
# because a filter selects its test the same way whether it grants a group slot
# or widens a timeout. Nextest's `=` form compares the whole test name, but a
# parameterized `#[rstest]` is identified by its instances, `name::case_1_…`,
# `name::case_2_…`, so `test(=NAME)` matches none of them and the test silently
# keeps whatever the default policy gives it. `^NAME($|::)` matches the plain
# name and every case suffix alike. Nextest's `~` substring form is deliberately
# avoided: it is unanchored, so `~domains` would match every test whose name
# contains that fragment.
#
# Applying the anchored form throughout is not about today's tests, most of
# which are not parameterized and so match either way. It is about the edit
# that comes later: adding a `#[case]` attribute to a filtered test must not
# silently unhook it from its policy, whichever override carries that policy.
# A guard scoped to the group's own filters was tried first and was too narrow.
# The field decides which tests an override touches, not the group: until
# issue 732 removed it, a Windows-only override widened one test's timeout
# through `filter` and no `test-group`, the same field carrying the same defect,
# and a guard reading only the group's filters could not see it.
# The cold Kani frontend compile outlasts the ordinary 300 s allowance. The
# prewarm runs separately before the sweep, and both use one target directory
# so the sweep reuses its dependency build. The negative test shares the
# prewarm's invocation: it compiles a valid tree and two deliberately broken
# ones, so it needs the same warm target and a build-capable group slot.
[[profile.default.overrides]]
filter = 'test(/^prewarm::prewarm_kani_mutation_target($|::)/)'
test-group = "nested-cargo-builds"
success-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'test(/^negative::compile_kani_tree_rejects_trees_that_do_not_compile($|::)/)'
test-group = "nested-cargo-builds"
success-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.default.overrides]]
filter = 'test(/^compile_guard::every_patched_tree_compiles_under_denied_warnings($|::)/)'
test-group = "nested-cargo-builds"
success-output = "immediate"
# Fifteen warning periods, not the profile's five. The cold-build and
# patch-sweep costs together exhaust one allowance on CI, so the prewarm now
# pays the cold cost in a separate invocation. The target directory is not
# restored by `kani-cache`.
#
# Measured: 151.5 s on a local host, and 257.7 s and 261.5 s on CI in two
# runs that both passed, against the 300 s default. A third CI run hit
# 300.008 s and failed. A margin of 38 s on a 300 s cap is not a budget, it
# is the difference between one runner and another, and the failure names
# nextest's cap rather than the patch that was slow. CI run 41782146443 passed
# in 480.264 s on the previous base; after rebasing, run 41826968891 reached
# this 600 s cap. Child compiler output is captured, so that establishes a
# lower bound but gives no per-patch timing. The 900 s allowance is the largest
# the 960 s whole-run budget admits and leaves 60 s for nextest to stop cleanly.
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.default.overrides]]
# The RFC 0006 coverage contract (obligation COV-4 in
# docs/execplans/6-1-1-split-rfc-0006-set-into-focused-child-rfcs-and-task.md).
# This test's whole point is the line it prints: how many capability groups are
# still unwritten. A half-finished split passes every other coverage check, so
# a stall is only visible if the count reaches the terminal on a green run.
filter = 'test(/^coverage_map_status_is_reported($|::)/)'
success-output = "immediate"

[profile.ci]
# The CI-only profile. It exists solely to carry the whole-run budget, and
# inherits everything else from `default`, including that profile's
# `[[overrides]]`: a nextest profile takes the default table wherever it
# declares nothing of its own.
#
# The coverage lanes select it with `NEXTEST_PROFILE: ci` at job level in
# `ci.yml` and `coverage-main.yml`. The shared `generate-coverage` action
# takes no profile input, so the environment variable is the only lever, and
# tests/workflow_contracts/whole_run_profile_test.py holds each lane to it.
#
# The whole test run, which no per-test budget bounds: a run whose tests each
# stay inside their allowance can still exceed the timers outside nextest
# between them, and the failure then names `cargo` rather than the run.
#
# Measured rather than guessed, per the policy above. Across the ten longest
# coverage steps of each of the last 59 runs of `ci.yml` and
# `coverage-main.yml` on 2026-09-15, the longest nextest run was 452.4s (run
# 34914144521, the pull-request lane) and 320.0s on the trunk lane (run
# 34240220630). Sixteen minutes clears the worst of those by 507.6s, and no run
# in the sample was ended by any of these timers.
#
# It bounds the instrumented run alone. The uninstrumented `cargo test --doc`
# pass the coverage action runs after it is not a nextest run, so nothing in
# this file bounds it and its own cargo watchdog does.
#
# The 16-minute global timeout is above the 900s per-test allowance used by
# every Kani gate test. Both comparisons hold:
#
#   global-timeout > largest per-test allowance
#   960 s          > 900 s
#
# The margin is not slack to be spent: a per-test allowance at or above the
# whole-run budget would make the run end before the test it contains could
# use its budget, so any targeted allowance must stay strictly below 960s, at
# most fifteen 60s periods (900s).
#
# The 1,980s cargo watchdog covers the full nextest termination, cold-build,
# and report window with 50s to spare: 960s + 70s + 600s + 300s is 1,930s.
# The report phase is the term that moved this value: `cargo llvm-cov` merges
# profile data and writes `lcov.info` after nextest's clock stops, measured at
# 274s on run 34914144521, so the earlier 900s budget no longer fitted.
#
# Deliberately not in `[profile.default]`, which every local `make test` uses.
# A developer's host is shared and contended in a way CI's is not, so a
# whole-run cap sized from CI logs would diagnose the budget rather than local
# contention. Local runs keep the per-test allowance and no whole-run cap.
#
# See "Test timeouts: the tiers this repository sets" in
# docs/developers-guide.md, which holds the arithmetic and the sample.
global-timeout = "16m"
