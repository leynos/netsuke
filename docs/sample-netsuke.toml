# Sample Netsuke configuration
#
# Copy this file to `.netsuke.toml` in a project root, or point Netsuke at it
# with `--config /path/to/file.toml` or `NETSUKE_CONFIG=/path/to/file.toml`.
#
# All settings below are commented out so the file is valid as-is. Uncomment
# only the keys you want to change.

# Path to the manifest file to use instead of `Netsukefile`.
# file = "Netsukefile"

# Number of parallel build jobs. Valid range: 1-64.
# jobs = 8

# Enable verbose diagnostics and timing summaries.
# verbose = true

# Locale for CLI messages, as a BCP 47 tag, for example `en-US`, `pt-BR` or
# `zh-Hant`. The exact tag is matched first, then the registry's per-language
# script and region rules, then the sole catalogue for that language if it has
# only one, so `fr-CA` uses `fr`, and finally `en-US`. Variants that differ in
# substance stay distinct: `pt-BR` never yields European Portuguese. See the
# users' guide for the full list.
# locale = "en-US"

# Emit one versioned JSON document: a result on success or diagnostic on failure.
# json = false

# Never read interactive input. This must remain true until an explicit
# interactive mode exists.
# no_input = true

# Colour output policy: `auto`, `always`, or `never`.
# color = "auto"

# Emoji policy: `auto`, `always`, or `never`.
# emoji = "auto"

# Progress policy: `auto`, `always`, or `never`.
# progress = "auto"

# Accessibility policy: `auto`, `on`, or `off`.
# accessibility = "auto"

# Default build targets when the CLI does not name any targets.
# default_targets = ["fmt", "lint", "test"]

# Additional URL schemes allowed for the `fetch` helper. When this file is the
# primary project `.netsuke.toml`, allow entries are project requests and are
# ignored unless an operator enables `trust_project_fetch_policy` in a trusted
# layer. A project cannot enable that opt-in for itself.
# fetch_allow_scheme = ["https"]

# Hostnames allowed when `fetch_default_deny = true`. The same project-request
# rule applies to these entries.
# Supports wildcards such as `*.example.com`.
# fetch_allow_host = ["example.com", "*.example.com"]

# Hostnames that are always blocked. Block entries accumulate across layers and
# take precedence over allow entries.
# Supports wildcards such as `*.example.com`.
# fetch_block_host = ["metadata.internal"]

# Deny all fetch hosts by default and allow only the declared allowlist. Without
# the opt-in, a project may set this to true to tighten the operator policy; a
# project false cannot weaken an operator's default-deny setting.
# fetch_default_deny = false

# Allow the primary project file's fetch grants to append to operator values.
# Set this only in system or user configuration, through
# NETSUKE_TRUST_PROJECT_FETCH_POLICY, or with --trust-project-fetch-policy;
# a project file cannot self-authorize.
# trust_project_fetch_policy = false

# CLI-only controls such as `--config`, `--directory`, and subcommands are not
# read from config files.
