# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "mold",
  "relativisable",
  "relativisably",
  "relativisation",
  "relativisations",
  "relativise",
  "relativised",
  "relativiser",
  "relativisers",
  "relativises",
  "relativising",
  "relativizable",
  "relativizably",
  "relativization",
  "relativizations",
  "relativize",
  "relativized",
  "relativizer",
  "relativizers",
  "relativizes",
  "relativizing",
]

[words.corrections]
# `mold` names the linker binary (https://github.com/rui314/mold), and `MOLD`
# appears in the associated environment-variable names; neither is prose.
mold = "mold"
MOLD = "MOLD"
exercize = "exercise"
exercized = "exercised"
exercizes = "exercises"
exercizing = "exercising"
otherwize = "otherwise"
raize = "raise"
raized = "raised"
raizes = "raises"
raizing = "raising"

[patterns]
# The tokenizer splits the valid hyphenated prefix in `mis-grouping`.
# Inline code spans quote identifiers verbatim (e.g. tokio's `flavor`
# attribute argument), so they are not en-GB prose and must stay exempt.
# The scanner tokenizes the `COLOR` suffix in this environment variable
# separately, so ignore the complete identifier rather than accepting `COLOR`.
# The shared dictionary corrects this en-GB term to American spelling; this
# repository's prose deliberately retains the required local form.
ignore = ["mis-grouping",
  # HTML attribute value in the README localization menus; not prose.
  "align=\"center\"",
  "\\blocalisation\\b",
  "`[^`\\n]+`",
  "NETSUKE_COLOR",
  "(?m)^            dist/\\$\\{\\{ inputs\\['bin-name'\\] \\}\\}-\\$\\{\\{ inputs\\.version \\}\\}-\\$\\{\\{ inputs\\['artifact-suffix'\\] \\}\\}\\.pkg$",
  "(?m)^          ARCHIVE_SUFFIX: \\$\\{\\{ inputs\\['artifact-suffix'\\] \\}\\}$",
  "(?m)^          name: \\$\\{\\{ inputs\\['artifact-name'\\] \\}\\}$",
  "(?m)^          upload-artefact: \\$\\{\\{ inputs\\['should-upload-workflow-artifacts'\\] \\}\\}$",
  "(?m)^        contents\\.contains\\(\"should_upload_workflow_artifacts: \\$\\{\\{ steps\\.release_modes\\.outputs\\['should-upload-workflow-artifacts'\\] \\}\\}\"\\),$",
  "(?m)^        contents\\.contains\\(\"upload-artefact: \\$\\{\\{ inputs\\['should-upload-workflow-artifacts'\\] \\}\\}\"\\),$",
  "(?m)^        if: inputs\\.platform == 'linux' && inputs\\['should-upload-workflow-artifacts'\\]$",
  "(?m)^        if: inputs\\.platform == 'macos' && inputs\\['should-upload-workflow-artifacts'\\]$",
  "(?m)^        if: inputs\\.platform == 'windows' && inputs\\['should-upload-workflow-artifacts'\\]$",
  "(?m)^        value: \\$\\{\\{ jobs\\.metadata\\.outputs\\.should_upload_workflow_artifacts \\}\\}$",
  "(?m)^      artifact-name: \\$\\{\\{ needs\\.metadata\\.outputs\\.repo_name \\}\\}-windows-\\$\\{\\{ matrix\\.package_arch \\}\\}$",
  "(?m)^      artifact-name:$",
  "(?m)^      artifact-suffix:$",
  "(?m)^      should-upload-workflow-artifacts: \\$\\{\\{ fromJSON\\(needs\\.metadata\\.outputs\\.should_upload_workflow_artifacts\\) \\}\\}$",
  "(?m)^      should-upload-workflow-artifacts:$",
  "(?m)^      should_upload_workflow_artifacts: \\$\\{\\{ steps\\.release_modes\\.outputs\\['should-upload-workflow-artifacts'\\] \\}\\}$",
  "(?m)^      should_upload_workflow_artifacts:$",
  "\\bartifact-dir\\b",
  "\\bartifact-name\\b",
  "\\bartifact-suffix\\b",
  "\\bNETSUKE_COLOR\\b",
]

[files]
# Translated READMEs are not en-GB prose; the en-GB-oxendict scan does not
# apply to them.
exclude = [
  ".vtcode/**",
  "README.de.md",
  "README.es.md",
  "README.fr.md",
  "README.ja.md",
  "README.pt-BR.md",
  "README.zh-CN.md",
  "scripts/tests/test_typos_rollout_hardening.py",
]
