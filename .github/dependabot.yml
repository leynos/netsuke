version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directories:
      - "/"
      - "/.github/actions/*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Enable version updates for Cargo
  - package-ecosystem: "cargo"
    groups:
      # The RustCrypto crates release in lockstep and share their breaking API
      # changes, so a bump that arrives on its own cannot compile: the 0.11
      # family moved `finalize()` to `hybrid_array::Array` and dropped the
      # hashers' `io::Write` impls together. Group them so a major arrives as
      # one reviewable, buildable pull request. See the "RustCrypto 0.11
      # constraint" section of docs/developers-guide.md.
      rustcrypto:
        patterns:
          - "digest"
          - "sha1"
          - "sha2"
          - "sha3"
          - "md-5"
          - "hmac"
          - "hkdf"
          - "pbkdf2"
          - "block-buffer"
          - "crypto-common"
          - "hybrid-array"
      # The rstest-bdd crates release in lockstep and one bumped alone does not
      # build. Cargo counts a 0.x minor as a major, which the catch-all leaves
      # ungrouped, so this group keeps the family in one pull request. It must
      # precede the catch-all: Dependabot uses the first group that matches.
      rstest-bdd:
        patterns:
          - "rstest-bdd*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    directories:
      - "/"
      - "/test_support"
      - "/tests/ui/cli_configuration_pass"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: rust-toolchain
    directory: /
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust-toolchain
    schedule:
      interval: daily
