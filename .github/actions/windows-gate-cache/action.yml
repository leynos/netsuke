---
name: Windows gate cache
description: >-
  Own every cache path the Windows jobs depend on. Ubicloud offers Linux
  runners only, so these jobs run on GitHub-hosted `windows-latest`. Every key
  carries the OS and architecture, so a Linux archive can never restore here.

  sccache uses a workspace directory here rather than its GitHub Actions
  backend: on that backend the gate recorded 643 failed writes out of 643,
  which is GitHub rate limiting, so the compiler cache travels as an archive
  like everything else. Cargo's `target` tree is deliberately absent, because
  sccache owns compiler output everywhere.

inputs:
  toolchain:
    description: >-
      Rust toolchain the Cargo and compiler-cache keys are scoped to. Declared
      rather than read from the environment: an action that depends on a
      variable its caller happens to set breaks silently when a new caller
      forgets it, and the key would then be shared across toolchains.
    required: true
  mode:
    description: '`restore` reads the trusted generation; `save` publishes it.'
    required: true
  profile:
    description: >-
      `gate` is the full merge gate, the single writer of every Windows key.
      `smoke` is the native-recipe job, which restores the gate's generation
      by prefix and publishes nothing.
    required: true
  registry-hit:
    description: Restore result for the Cargo download store.
    required: false
    default: ''
  tools-hit:
    description: Restore result for the tool directories.
    required: false
    default: ''
  whitaker-hit:
    description: Restore result for the Whitaker suite.
    required: false
    default: ''
  sccache-hit:
    description: Restore result for the compiler cache directory.
    required: false
    default: ''
outputs:
  registry-hit:
    description: Whether the Cargo download store restored exactly.
    value: ${{ steps.registry.outputs.cache-hit }}
  tools-hit:
    description: Whether the tool directories restored exactly.
    value: ${{ steps.tools.outputs.cache-hit }}
  whitaker-hit:
    description: Whether the Whitaker suite restored exactly.
    value: ${{ steps.whitaker.outputs.cache-hit }}
  sccache-hit:
    description: Whether the compiler cache directory restored exactly.
    value: ${{ steps.sccache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Render cache keys
      id: keys
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        NETSUKE_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        IS_TRUNK_PUSH: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Rendered after checkout because the source hashes need the workspace,
      # and once per call so restore, save, and the observation summary cannot
      # drift apart. The smoke profile asks for the prefix rather than an exact
      # key: it has no generation of its own to publish.
      run: |
        set -euo pipefail
        lane="${RUNNER_OS}-${RUNNER_ARCH}-${RUNNER_ENVIRONMENT}"
        sources="$(sha256sum Cargo.lock rust-toolchain.toml | sha256sum | cut -c1-16)"
        pins="$(sha256sum .github/actions/windows-gate-cache/action.yml \
          .github/workflows/ci-windows.yml | sha256sum | cut -c1-16)"
        dylint="$(sha256sum dylint.toml | cut -c1-16)"
        cargo_prefix="netsuke-cargo-v1-${lane}-${NETSUKE_RUST_TOOLCHAIN}-"
        sccache_prefix="netsuke-sccache-v1-${lane}-${NETSUKE_RUST_TOOLCHAIN}-"
        cargo_key="${cargo_prefix}${sources}"
        sccache_key="${sccache_prefix}${GITHUB_SHA}"
        if [ "${PROFILE}" = 'smoke' ]; then
          cargo_key="${cargo_prefix}"
          sccache_key="${sccache_prefix}"
        fi
        {
          printf 'writer=%s\n' "${IS_TRUNK_PUSH}"
          printf 'registry=%s\n' "${cargo_key}"
          printf 'registry-prefix=%s\n' "${cargo_prefix}"
          printf 'tools=netsuke-tools-v1-%s-%s\n' "${lane}" "${pins}"
          printf 'whitaker=netsuke-whitaker-v1-%s-%s-%s\n' \
            "${lane}" "${pins}" "${dylint}"
          printf 'sccache=%s\n' "${sccache_key}"
          printf 'sccache-prefix=%s\n' "${sccache_prefix}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Cargo download store
      id: registry
      if: inputs.mode == 'restore'
      # Step A. `target` is deliberately absent: sccache owns compiler output.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ steps.keys.outputs.registry }}
        restore-keys: ${{ steps.keys.outputs['registry-prefix'] }}

    - name: Restore tool directories
      id: tools
      if: inputs.mode == 'restore' && inputs.profile == 'gate'
      # Steps C and D merged, plus Chocolatey's download location: the gate
      # installs GNU Make through it and nothing else caches that directory.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/bin
          ~/.local/bin
          .chocolatey-cache
          .mdtablefix-build
        key: ${{ steps.keys.outputs.tools }}

    - name: Restore Whitaker suite
      id: whitaker
      if: inputs.mode == 'restore' && inputs.profile == 'gate'
      # Step E, mounting the parent of the installer-managed directory so a
      # cold run leaves no empty suite directory behind. The installer
      # executable lives in `~/.cargo/bin` and belongs to the tool step above.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/AppData/Roaming/github
        key: ${{ steps.keys.outputs.whitaker }}

    - name: Restore compiler cache
      id: sccache
      if: inputs.mode == 'restore'
      # `SCCACHE_DIR` names this same path. A rolling key with a prefix
      # restore-key keeps a warm run starting from the newest generation.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .sccache
        key: ${{ steps.keys.outputs.sccache }}
        restore-keys: ${{ steps.keys.outputs['sccache-prefix'] }}

    - name: Record cache observations
      if: always() && inputs.mode == 'restore'
      shell: bash
      # An operator must be able to explain every miss from the run evidence
      # alone, so the rendered key travels with its result.
      env:
        PROFILE: ${{ inputs.profile }}
        REGISTRY_KEY: ${{ steps.keys.outputs.registry }}
        REGISTRY_HIT: ${{ steps.registry.outputs.cache-matched-key }}
        TOOLS_KEY: ${{ steps.keys.outputs.tools }}
        TOOLS_HIT: ${{ steps.tools.outputs.cache-matched-key }}
        WHITAKER_KEY: ${{ steps.keys.outputs.whitaker }}
        WHITAKER_HIT: ${{ steps.whitaker.outputs.cache-matched-key }}
        SCCACHE_KEY: ${{ steps.keys.outputs.sccache }}
        SCCACHE_HIT: ${{ steps.sccache.outputs.cache-matched-key }}
      run: |
        {
          printf '### Cache observations\n\n'
          printf -- '- registry key: `%s` matched: `%s`\n' \
            "${REGISTRY_KEY}" "${REGISTRY_HIT:-none}"
          printf -- '- sccache key: `%s` matched: `%s`\n' \
            "${SCCACHE_KEY}" "${SCCACHE_HIT:-none}"
          if [ "${PROFILE}" = 'gate' ]; then
            printf -- '- tools key: `%s` matched: `%s`\n' \
              "${TOOLS_KEY}" "${TOOLS_HIT:-none}"
            printf -- '- whitaker key: `%s` matched: `%s`\n' \
              "${WHITAKER_KEY}" "${WHITAKER_HIT:-none}"
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Save Cargo download store
      if: >-
        inputs.mode == 'save' && inputs.profile == 'gate' &&
        steps.keys.outputs.writer == 'true' && inputs['registry-hit'] != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ steps.keys.outputs.registry }}

    - name: Save tool directories
      if: >-
        inputs.mode == 'save' && inputs.profile == 'gate' &&
        steps.keys.outputs.writer == 'true' && inputs['tools-hit'] != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cargo/bin
          ~/.local/bin
          .chocolatey-cache
          .mdtablefix-build
        key: ${{ steps.keys.outputs.tools }}

    - name: Save compiler cache
      if: >-
        inputs.mode == 'save' && inputs.profile == 'gate' &&
        steps.keys.outputs.writer == 'true' && inputs['sccache-hit'] != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .sccache
        key: ${{ steps.keys.outputs.sccache }}

    - name: Save Whitaker suite
      if: >-
        inputs.mode == 'save' && inputs.profile == 'gate' &&
        steps.keys.outputs.writer == 'true' && inputs['whitaker-hit'] != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/AppData/Roaming/github
        key: ${{ steps.keys.outputs.whitaker }}

