---
name: Verify release inventory
description: >-
  Download a draft release's attached assets with read-only API calls and verify
  them against the declaration and trusted digest record the publisher retained,
  writing the digest record that the release's inventory has been confirmed.

# The token is an input rather than an implicit `secrets.GITHUB_TOKEN` so this
# action can be read in one place: the caller grants a token, and the steps that
# need one receive it through the environment. Draft releases are visible only
# with write access, so the caller's `contents: write` is what makes the listing
# return anything at all.
inputs:
  tag:
    description: >-
      The release tag whose single draft release is verified. A published
      release with the tag is refused: the draft this action expects is gone.
    required: true
  repository:
    description: >-
      The `OWNER/REPOSITORY` the release lives in. Passed explicitly because the
      listing endpoints are addressed by it, and because a fork's release is not
      the upstream's.
    required: true
  trusted-directory:
    description: >-
      The directory holding the publisher's retained declaration and digest
      record. It must be disjoint from the download directory, so a downloaded
      file can never stand in for a trusted input.
    required: true
  declaration-file:
    description: >-
      The declared asset names, relative to `trusted-directory`. The verifier
      compares the downloaded names against it exactly.
    required: true
  trusted-record-file:
    description: >-
      The digest record produced from the built bytes before upload, relative to
      `trusted-directory`. It is the only input that can detect a substituted
      attachment that agrees with its own sidecar.
    required: true
  download-directory:
    description: >-
      The directory the release's attached assets are downloaded into. It must
      be absent or empty, so a leftover file from an earlier attempt cannot be
      counted as part of this release.
    required: true
  output-path:
    description: The verified digest record the verification step writes.
    required: true
  github-token:
    description: >-
      The token used for the release and asset listings and for each attachment
      download. It is not given to the verification step, which reads only bytes
      already on disk.
    required: true

outputs:
  verified-record-path:
    description: The verified digest record written by the verification step.
    value: ${{ steps.verify.outputs.verified-record-path }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        TRUSTED_DIRECTORY: ${{ inputs['trusted-directory'] }}
        DECLARATION_FILE: ${{ inputs['declaration-file'] }}
        TRUSTED_RECORD_FILE: ${{ inputs['trusted-record-file'] }}
        DOWNLOAD_DIRECTORY: ${{ inputs['download-directory'] }}
        OUTPUT_PATH: ${{ inputs['output-path'] }}
      run: |
        set -euo pipefail
        require_value() {
          local name="$1" value="$2"
          if [[ -z "$value" ]]; then
            printf '%s must not be empty\n' "$name" >&2
            exit 1
          fi
        }
        # `realpath -m` resolves a path that does not exist yet, so an output
        # path is comparable before the verifier creates it. Without that, an
        # overlap involving the output would only be noticed after a download
        # had already written into the trusted inputs' directory.
        canonical() {
          realpath -m -- "$1"
        }
        overlaps() {
          local first="${1%/}/" second="${2%/}/"
          [[ "$1" == "$2" || "$1" == "$second"* || "$2" == "$first"* ]]
        }
        require_disjoint() {
          local first_label="$1" first="$2" second_label="$3" second="$4"
          if overlaps "$first" "$second"; then
            printf '%s (%s) and %s (%s) must be disjoint\n' \
              "$first_label" "$first" "$second_label" "$second" >&2
            exit 1
          fi
        }
        require_inside() {
          local label="$1" path="$2" root="$3"
          if [[ "$path" != "${root%/}/"* ]]; then
            printf '%s (%s) must be inside %s\n' "$label" "$path" "$root" >&2
            exit 1
          fi
        }
        require_value tag "$RELEASE_TAG"
        for name in TRUSTED_DIRECTORY DECLARATION_FILE TRUSTED_RECORD_FILE \
          DOWNLOAD_DIRECTORY OUTPUT_PATH; do
          require_value "$name" "${!name}"
        done
        trusted_root="$(canonical "$TRUSTED_DIRECTORY")"
        download_root="$(canonical "$DOWNLOAD_DIRECTORY")"
        output_file="$(canonical "$OUTPUT_PATH")"
        declaration="$(canonical "$DECLARATION_FILE")"
        record="$(canonical "$TRUSTED_RECORD_FILE")"
        require_disjoint trusted-directory "$trusted_root" \
          download-directory "$download_root"
        require_disjoint trusted-directory "$trusted_root" \
          output-path "$output_file"
        require_disjoint download-directory "$download_root" \
          output-path "$output_file"
        require_inside declaration-file "$declaration" "$trusted_root"
        require_inside trusted-record-file "$record" "$trusted_root"
        for file in "$declaration" "$record"; do
          if [[ ! -f "$file" ]]; then
            printf 'trusted input %s is not a regular file\n' "$file" >&2
            exit 1
          fi
        done
        # The download directory is what the verifier walks to build the
        # observed inventory, so anything already in it would be counted as an
        # attachment of this release. Refusing a non-empty directory keeps a
        # re-run on the same runner from succeeding on the previous attempt's
        # bytes.
        if [[ -e "$DOWNLOAD_DIRECTORY" ]]; then
          if [[ ! -d "$DOWNLOAD_DIRECTORY" ]]; then
            printf 'download-directory (%s) must be a directory\n' \
              "$DOWNLOAD_DIRECTORY" >&2
            exit 1
          fi
          if [[ -n "$(ls -A -- "$DOWNLOAD_DIRECTORY")" ]]; then
            printf 'download-directory (%s) must be empty\n' \
              "$DOWNLOAD_DIRECTORY" >&2
            exit 1
          fi
        fi

    - name: List draft releases
      id: list-releases
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs['github-token'] }}
        INVENTORY_WORK_DIR: ${{ runner.temp }}/release-inventory
      run: |
        set -euo pipefail
        mkdir -p "$INVENTORY_WORK_DIR"
        # GET with `--slurp` wraps every page in one array, which is the shape
        # the selection policy models. A POST would be rejected by the endpoint,
        # but the `--method GET` is explicit so no later flag can change it.
        gh api --method GET --paginate --slurp \
          "repos/$RELEASE_REPOSITORY/releases" \
          >"$INVENTORY_WORK_DIR/releases.json"
        uv run --no-project --python 3.14 scripts/release_draft_assets_cli.py \
          select-release \
          --listing "$INVENTORY_WORK_DIR/releases.json" \
          --tag "$RELEASE_TAG" \
          --output "$INVENTORY_WORK_DIR/release-id.txt"

    - name: List draft assets
      id: list-assets
      shell: bash
      env:
        RELEASE_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs['github-token'] }}
        INVENTORY_WORK_DIR: ${{ runner.temp }}/release-inventory
      run: |
        set -euo pipefail
        release_id="$(cat "$INVENTORY_WORK_DIR/release-id.txt")"
        gh api --method GET --paginate --slurp \
          "repos/$RELEASE_REPOSITORY/releases/$release_id/assets" \
          >"$INVENTORY_WORK_DIR/assets.json"
        uv run --no-project --python 3.14 scripts/release_draft_assets_cli.py \
          plan-downloads \
          --listing "$INVENTORY_WORK_DIR/assets.json" \
          --output "$INVENTORY_WORK_DIR/download-plan.txt"

    - name: Download draft assets
      id: download
      shell: bash
      env:
        RELEASE_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs['github-token'] }}
        INVENTORY_WORK_DIR: ${{ runner.temp }}/release-inventory
        DOWNLOAD_DIRECTORY: ${{ inputs['download-directory'] }}
      run: |
        set -euo pipefail
        mkdir -p "$DOWNLOAD_DIRECTORY"
        # A name repeated in the plan would otherwise let the second download
        # replace the first, so the plan is refused for duplicates upstream and
        # noclobber turns any survivor into a failure rather than a silent
        # overwrite. No retry: a partial download must stop the job, not be
        # papered over, because the verifier cannot tell it from a truncated
        # attachment that somehow matched.
        set -o noclobber
        while IFS=$'\t' read -r asset_id asset_name; do
          [[ -n "$asset_id" ]] || continue
          gh api --method GET \
            -H 'Accept: application/octet-stream' \
            "repos/$RELEASE_REPOSITORY/releases/assets/$asset_id" \
            >"$DOWNLOAD_DIRECTORY/$asset_name"
        done <"$INVENTORY_WORK_DIR/download-plan.txt"

    - name: Verify inventory
      id: verify
      shell: bash
      env:
        DOWNLOAD_DIRECTORY: ${{ inputs['download-directory'] }}
        DECLARATION_FILE: ${{ inputs['declaration-file'] }}
        TRUSTED_RECORD_FILE: ${{ inputs['trusted-record-file'] }}
        OUTPUT_PATH: ${{ inputs['output-path'] }}
      run: |
        set -euo pipefail
        # This step deliberately receives no token: every byte it reads is
        # already on disk, so a credential here could only widen the blast
        # radius of a compromised verifier.
        mkdir -p "$(dirname "$OUTPUT_PATH")"
        uv run --no-project --python 3.14 scripts/verify_release_inventory_cli.py \
          --directory "$DOWNLOAD_DIRECTORY" \
          --expected "$DECLARATION_FILE" \
          --trusted "$TRUSTED_RECORD_FILE" \
          --output "$OUTPUT_PATH"
        printf 'verified-record-path=%s\n' "$OUTPUT_PATH" >>"$GITHUB_OUTPUT"