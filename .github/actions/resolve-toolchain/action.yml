name: Resolve the pinned toolchain
description: >
  Export the channel that rust-toolchain.toml pins as NETSUKE_RUST_TOOLCHAIN
  for every later step of the job, so no workflow restates a dated nightly that
  Dependabot's daily bumps would leave behind. Run it directly after checkout:
  the value is a non-empty explicit channel, which keeps setup-rust on its
  explicit-toolchain arm (an empty input would take the rust-toolchain-file
  arm, which does not displace a stale cached directory override).
runs:
  using: composite
  steps:
    - name: Read the channel from rust-toolchain.toml
      shell: bash
      run: |
        set -euo pipefail
        toolchain="$(
          sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            rust-toolchain.toml | head -n 1
        )"
        if [ -z "${toolchain}" ]; then
          echo "::error title=Resolve the pinned toolchain::rust-toolchain.toml declares no channel" >&2
          exit 1
        fi
        printf 'NETSUKE_RUST_TOOLCHAIN=%s\n' "${toolchain}" >> "$GITHUB_ENV"
