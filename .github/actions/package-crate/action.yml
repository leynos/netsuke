---
name: Package crate
description: >-
  Resolve one release candidate's identity and package the crate it names,
  producing the `.crate` archive and the record that vouches for it.

inputs:
  tag:
    description: >-
      The release tag, for example `v0.1.0-beta4`. Supply this on a release, or
      leave it empty and set `dry-run` for a rehearsal: a pull request has a
      merge ref rather than a release tag, so there is no tag to record.
    required: false
    default: ''
  dry-run:
    description: >-
      When `true`, record that this run has no release tag because it is a
      rehearsal. The crate is still packaged and digested; only the identity's
      `tag` is absent. `tag` is still passed by the caller in both modes, and
      this input selects which of the two flags the step forwards, so the
      action cannot present the CLI with both at once.
    required: false
    default: 'false'
  commit:
    description: >-
      The full commit SHA the workflow checked out. Supplied by the caller from
      `github.sha`, so the identity records the revision the bytes were built
      from rather than one resolved separately and never observed.
    required: true
  package-name:
    description: >-
      The Cargo package name, which differs from the binary name. `Cargo.toml`
      declares `package.name = "netsuke-build"` while the binary is `netsuke`.
    required: true
  version:
    description: The crate version declared in the manifest.
    required: true
  bin-name:
    description: The installed binary name.
    required: true

outputs:
  identity-path:
    description: The identity record the packaging stage wrote.
    value: ${{ steps.package.outputs.identity-path }}
  crate-path:
    description: The packaged `.crate` archive, resolved from that record.
    value: ${{ steps.package.outputs.crate-path }}
  crate-name:
    description: The archive's file name, as the record spells it.
    value: ${{ steps.package.outputs.crate-name }}
  # The job times packaging and candidate validation from inside the action,
  # because the workflow cannot bracket the boundary between them: the check
  # runs after packaging and before the artefact upload, and only the action
  # sees that point. Reporting the two outcomes separately keeps a rejected
  # candidate from being recorded as a packaging failure.
  crate-packaging-outcome:
    description: Outcome of the packaging step alone.
    value: ${{ steps.package.outcome }}
  crate-packaging-started-ns:
    description: Packaging start time in nanoseconds.
    value: ${{ steps.package.outputs.started_ns }}
  crate-packaging-ended-ns:
    description: Packaging end time in nanoseconds.
    value: ${{ steps.package.outputs.ended_ns }}
  crate-candidate-validation-outcome:
    description: Outcome of the offline candidate check alone.
    value: ${{ steps.candidate.outcome }}
  crate-candidate-validation-started-ns:
    description: Candidate validation start time in nanoseconds.
    value: ${{ steps.candidate.outputs.started_ns }}
  crate-candidate-validation-ended-ns:
    description: Candidate validation end time in nanoseconds.
    value: ${{ steps.candidate.outputs.ended_ns }}

runs:
  using: composite
  steps:
    - name: Package crate
      id: package
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_DRY_RUN: ${{ inputs['dry-run'] }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_PACKAGE_NAME: ${{ inputs['package-name'] }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_BIN_NAME: ${{ inputs['bin-name'] }}
      run: |
        set -euo pipefail
        # Time this step from an exit trap, so a failure still reports an end
        # time: the job can then attribute the duration and the outcome to
        # packaging rather than to whatever ran after it.
        printf 'started_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        record_ended_ns() {
          local status=$?
          trap - EXIT
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
          exit "$status"
        }
        trap record_ended_ns EXIT
        mkdir -p artifacts/package
        # A rehearsal has no release tag to name, so the two are selected here
        # rather than passed together and reconciled in the CLI. The CLI also
        # refuses both at once, so a caller that supplies each reaches an
        # argument error instead of an identity that quietly prefers one.
        case "$RELEASE_DRY_RUN" in
          true) release_selector=(--dry-run) ;;
          false) release_selector=(--tag "$RELEASE_TAG") ;;
          *)
            printf 'dry-run must be true or false, got %s\n' "$RELEASE_DRY_RUN" >&2
            exit 1
            ;;
        esac
        uv run --no-project --python 3.14 scripts/package_crate_cli.py \
          "${release_selector[@]}" \
          --commit "$RELEASE_COMMIT" \
          --package-name "$RELEASE_PACKAGE_NAME" \
          --version "$RELEASE_VERSION" \
          --bin-name "$RELEASE_BIN_NAME" \
          --manifest Cargo.toml \
          --target-dir target \
          --output artifacts/package/identity.json
        # The record stores the archive's *name*; `cargo package --target-dir`
        # nests it one level down, so the directory is supplied here rather
        # than read from the record.
        crate_name="$(jq -r '.crate' artifacts/package/identity.json)"
        {
          printf 'identity-path=%s\n' 'artifacts/package/identity.json'
          printf 'crate-name=%s\n' "$crate_name"
          printf 'crate-path=%s\n' "target/package/$crate_name"
        } >>"$GITHUB_OUTPUT"

    - name: Validate the packaged candidate offline
      id: candidate
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_DRY_RUN: ${{ inputs['dry-run'] }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_PACKAGE_NAME: ${{ inputs['package-name'] }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Timing mirrors the packaging step: the exit trap makes a rejection a
        # timed failure of this phase rather than an untimed gap after a
        # successful one.
        printf 'started_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        record_ended_ns() {
          local status=$?
          trap - EXIT
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
          exit "$status"
        }
        trap record_ended_ns EXIT
        # The publisher validates this candidate again after the artefact
        # hand-off. Running the same check here, before upload, proves the
        # archive and its record agree while both are still local, and gives a
        # pull-request rehearsal the same boundary without a registry request.
        # The mode selector mirrors the packaging step: a rehearsal records no
        # tag, so it must be checked as a rehearsal rather than against one.
        case "$RELEASE_DRY_RUN" in
          true) release_mode=(--rehearsal) ;;
          false) release_mode=(--tag "$RELEASE_TAG") ;;
          *)
            printf 'dry-run must be true or false, got %s\n' "$RELEASE_DRY_RUN" >&2
            exit 1
            ;;
        esac
        uv run --no-project --python 3.14 scripts/crates_io_candidate_cli.py check \
          --identity artifacts/package/identity.json \
          --archive-directory target/package \
          "${release_mode[@]}" \
          --commit "$RELEASE_COMMIT" \
          --package-name "$RELEASE_PACKAGE_NAME" \
          --version "$RELEASE_VERSION" \
          --output "$RUNNER_TEMP/crates-io-candidate.json"
