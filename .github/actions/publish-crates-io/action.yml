name: Publish crate to crates.io
description: >-
  Validate and publish the retained package-crate archive only when crates.io
  does not already contain the same version and bytes.

inputs:
  identity-path:
    description: Path to the package-crate identity record.
    required: true
  archive-directory:
    description: Directory containing the one archive named by the identity.
    required: true
  tag:
    description: Validated release tag for this publishing run.
    required: true
  commit:
    description: Full commit SHA that produced the candidate.
    required: true
  package-name:
    description: Expected Cargo package name from release metadata.
    required: true
  version:
    description: Expected Cargo package version from release metadata.
    required: true

outputs:
  action:
    description: Registry decision, either publish or skip.
    value: ${{ steps.decision.outputs.action }}
  crate-name:
    description: Archive basename recorded by package-crate.
    value: ${{ steps.candidate.outputs.crate-name }}
  package-name:
    description: Cargo package name validated from the retained archive.
    value: ${{ steps.candidate.outputs.package-name }}
  crate-version:
    description: Version being verified against the registry.
    value: ${{ inputs.version }}
  registry-state:
    description: Bounded state classified from the crates.io probe.
    value: ${{ steps.decision.outputs.state }}
  verification-verdict:
    description: Outcome of registry archive byte verification.
    value: ${{ steps.verify.outcome }}
  sha256:
    description: Digest of the validated candidate archive.
    value: ${{ steps.candidate.outputs.sha256 }}
  verified-sha256:
    description: Digest of the downloaded registry archive.
    value: ${{ steps.verify.outputs.sha256 }}
  crate-candidate-validation-outcome:
    description: Candidate validation step outcome.
    value: ${{ steps.candidate.outcome }}
  crate-candidate-validation-started-ns:
    description: Candidate validation start time in nanoseconds.
    value: ${{ steps.candidate.outputs.started_ns }}
  crate-candidate-validation-ended-ns:
    description: Candidate validation end time in nanoseconds.
    value: ${{ steps.candidate.outputs.ended_ns }}
  registry-probe-outcome:
    description: Registry probe step outcome.
    value: ${{ steps.probe.outcome }}
  registry-probe-started-ns:
    description: Registry probe start time in nanoseconds.
    value: ${{ steps.probe.outputs.started_ns }}
  registry-probe-ended-ns:
    description: Registry probe end time in nanoseconds.
    value: ${{ steps.probe.outputs.ended_ns }}
  registry-decision-outcome:
    description: Registry classification step outcome.
    value: ${{ steps.decision.outcome }}
  registry-decision-started-ns:
    description: Registry classification start time in nanoseconds.
    value: ${{ steps.decision.outputs.started_ns }}
  registry-decision-ended-ns:
    description: Registry classification end time in nanoseconds.
    value: ${{ steps.decision.outputs.ended_ns }}
  trusted-publishing-authentication-outcome:
    description: Trusted Publishing authentication step outcome.
    value: ${{ steps.auth.outcome }}
  trusted-publishing-authentication-started-ns:
    description: Trusted Publishing authentication start time in nanoseconds.
    value: ${{ steps.auth_start.outputs.started_ns }}
  trusted-publishing-authentication-ended-ns:
    description: Trusted Publishing authentication end time in nanoseconds.
    value: ${{ steps.auth_end.outputs.ended_ns }}
  registry-metadata-derivation-outcome:
    description: Registry metadata derivation step outcome.
    value: ${{ steps.metadata.outcome }}
  registry-metadata-derivation-started-ns:
    description: Registry metadata derivation start time in nanoseconds.
    value: ${{ steps.metadata.outputs.started_ns }}
  registry-metadata-derivation-ended-ns:
    description: Registry metadata derivation end time in nanoseconds.
    value: ${{ steps.metadata.outputs.ended_ns }}
  registry-upload-outcome:
    description: Registry upload step outcome.
    value: ${{ steps.upload.outcome }}
  registry-upload-started-ns:
    description: Registry upload start time in nanoseconds.
    value: ${{ steps.upload.outputs.started_ns }}
  registry-upload-ended-ns:
    description: Registry upload end time in nanoseconds.
    value: ${{ steps.upload.outputs.ended_ns }}
  registry-download-outcome:
    description: Registry download step outcome.
    value: ${{ steps.download.outcome }}
  registry-download-started-ns:
    description: Registry download start time in nanoseconds.
    value: ${{ steps.download.outputs.started_ns }}
  registry-download-ended-ns:
    description: Registry download end time in nanoseconds.
    value: ${{ steps.download.outputs.ended_ns }}
  registry-download-attempts:
    description: Bounded number of archive polling attempts.
    value: ${{ steps.download.outputs.attempts }}
  registry-download-status-class:
    description: Last bounded HTTP status class observed while polling.
    value: ${{ steps.download.outputs.status-class }}
  registry-download-elapsed-ms:
    description: Total archive polling duration in milliseconds.
    value: ${{ steps.download.outputs.elapsed-ms }}
  registry-byte-verification-outcome:
    description: Registry byte verification step outcome.
    value: ${{ steps.verify.outcome }}
  registry-byte-verification-started-ns:
    description: Registry byte verification start time in nanoseconds.
    value: ${{ steps.verify.outputs.started_ns }}
  registry-byte-verification-ended-ns:
    description: Registry byte verification end time in nanoseconds.
    value: ${{ steps.verify.outputs.ended_ns }}

runs:
  using: composite
  steps:
    - id: candidate
      name: Validate the packaged candidate
      shell: bash
      env:
        IDENTITY_PATH: ${{ inputs['identity-path'] }}
        ARCHIVE_DIRECTORY: ${{ inputs['archive-directory'] }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_PACKAGE_NAME: ${{ inputs['package-name'] }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        started_ns="$(date +%s%N)"
        printf 'started_ns=%s\n' "$started_ns" >>"$GITHUB_OUTPUT"
        finish_step_timing() {
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        }
        trap finish_step_timing EXIT
        uv run --no-project --python 3.14 scripts/crates_io_candidate_cli.py check \
          --identity "$IDENTITY_PATH" \
          --archive-directory "$ARCHIVE_DIRECTORY" \
          --tag "$RELEASE_TAG" \
          --commit "$RELEASE_COMMIT" \
          --package-name "$RELEASE_PACKAGE_NAME" \
          --version "$RELEASE_VERSION" \
          --output "$RUNNER_TEMP/crates-io-candidate.json"
        crate_name="$(jq -r '.crate' "$RUNNER_TEMP/crates-io-candidate.json")"
        sha256="$(jq -r '.sha256' "$RUNNER_TEMP/crates-io-candidate.json")"
        package_name="$(jq -r '.identity.package_name' "$RUNNER_TEMP/crates-io-candidate.json")"
        {
          printf 'crate-name=%s\n' "$crate_name"
          printf 'sha256=%s\n' "$sha256"
          printf 'package-name=%s\n' "$package_name"
          printf 'crate-path=%s\n' "$ARCHIVE_DIRECTORY/$crate_name"
        } >>"$GITHUB_OUTPUT"

    - id: probe
      name: Probe the registry before mutation
      shell: bash
      env:
        CRATE_NAME: ${{ steps.candidate.outputs.package-name }}
        RELEASE_VERSION: ${{ inputs.version }}
        PROBE_DIRECTORY: ${{ runner.temp }}/crates-io-probe
      run: |
        set -euo pipefail
        started_ns="$(date +%s%N)"
        printf 'started_ns=%s\n' "$started_ns" >>"$GITHUB_OUTPUT"
        finish_step_timing() {
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        }
        trap finish_step_timing EXIT
        mkdir -p "$PROBE_DIRECTORY"
        uv run --no-project --python 3.14 scripts/crates_io_transport_cli.py probe \
          --crate "$CRATE_NAME" \
          --version "$RELEASE_VERSION" \
          --status-file "$PROBE_DIRECTORY/status" \
          --body-file "$PROBE_DIRECTORY/body"

    - id: decision
      name: Classify registry state
      shell: bash
      env:
        CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        RELEASE_VERSION: ${{ inputs.version }}
        PROBE_DIRECTORY: ${{ runner.temp }}/crates-io-probe
        DECISION_PATH: ${{ runner.temp }}/crates-io-decision.json
      run: |
        set -euo pipefail
        started_ns="$(date +%s%N)"
        printf 'started_ns=%s\n' "$started_ns" >>"$GITHUB_OUTPUT"
        finish_step_timing() {
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        }
        trap finish_step_timing EXIT
        classify_args=(
          classify
          --status "$(cat "$PROBE_DIRECTORY/status")"
          --version "$RELEASE_VERSION"
          --sha256 "$CANDIDATE_SHA256"
          --output "$DECISION_PATH"
        )
        if [[ -s "$PROBE_DIRECTORY/body" ]]; then
          classify_args+=(--body "$PROBE_DIRECTORY/body")
        fi
        classification_status=0
        if uv run --no-project --python 3.14 scripts/publish_crates_io_cli.py \
          "${classify_args[@]}"; then
          :
        else
          classification_status=$?
        fi
        action=fail
        state=indeterminate
        if [[ -s "$DECISION_PATH" ]]; then
          action="$(jq -r '.action // empty' "$DECISION_PATH" 2>/dev/null)" || action=""
          state="$(jq -r '.state // empty' "$DECISION_PATH" 2>/dev/null)" || state=""
        else
          classification_status=1
        fi
        case "$action" in
          publish|skip|fail) ;;
          *) action=fail; classification_status=1 ;;
        esac
        case "$state" in
          absent|identical|conflict|yanked|indeterminate) ;;
          *) action=fail; state=indeterminate; classification_status=1 ;;
        esac
        if [[ "$classification_status" -ne 0 ]]; then
          action=fail
        fi
        if [[ "$action" == fail && "$classification_status" -eq 0 ]]; then
          classification_status=1
        fi
        printf 'action=%s\n' "$action" >>"$GITHUB_OUTPUT"
        printf 'state=%s\n' "$state" >>"$GITHUB_OUTPUT"
        exit "$classification_status"

    - id: auth_start
      name: Start Trusted Publishing authentication timing
      if: steps.decision.outputs.action == 'publish'
      shell: bash
      run: printf 'started_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"

    - id: auth
      name: Exchange GitHub identity for a short-lived crates.io token
      if: steps.decision.outputs.action == 'publish'
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9

    - id: auth_end
      name: Finish Trusted Publishing authentication timing
      if: always()
      shell: bash
      env:
        AUTH_STARTED_NS: ${{ steps.auth_start.outputs.started_ns }}
      run: |
        if [[ -n "$AUTH_STARTED_NS" ]]; then
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        fi

    - id: metadata
      name: Derive registry metadata from the retained archive
      if: steps.decision.outputs.action == 'publish'
      shell: bash
      env:
        CRATE_ARCHIVE: ${{ steps.candidate.outputs.crate-path }}
        METADATA_PATH: ${{ runner.temp }}/crates-io-metadata.json
      run: |
        set -euo pipefail
        started_ns="$(date +%s%N)"
        printf 'started_ns=%s\n' "$started_ns" >>"$GITHUB_OUTPUT"
        finish_step_timing() {
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        }
        trap finish_step_timing EXIT
        uv run --no-project --python 3.14 scripts/crates_io_candidate_cli.py metadata \
          --archive "$CRATE_ARCHIVE" \
          --output "$METADATA_PATH"

    - id: upload
      name: Publish the unchanged archive bytes
      if: steps.decision.outputs.action == 'publish'
      shell: bash
      env:
        CRATE_ARCHIVE: ${{ steps.candidate.outputs.crate-path }}
        METADATA_PATH: ${{ runner.temp }}/crates-io-metadata.json
        CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        set -euo pipefail
        started_ns="$(date +%s%N)"
        printf 'started_ns=%s\n' "$started_ns" >>"$GITHUB_OUTPUT"
        finish_step_timing() {
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        }
        trap finish_step_timing EXIT
        uv run --no-project --python 3.14 scripts/crates_io_transport_cli.py upload \
          --metadata "$METADATA_PATH" \
          --archive "$CRATE_ARCHIVE"

    - id: download
      name: Download the registry archive for byte verification
      shell: bash
      env:
        CRATE_NAME: ${{ steps.candidate.outputs.package-name }}
        RELEASE_VERSION: ${{ inputs.version }}
        DOWNLOAD_DIRECTORY: ${{ runner.temp }}/crates-io-download
        DOWNLOAD_REPORT: ${{ runner.temp }}/crates-io-download/report.json
      run: |
        set -euo pipefail
        started_ns="$(date +%s%N)"
        printf 'started_ns=%s\n' "$started_ns" >>"$GITHUB_OUTPUT"
        finish_step_timing() {
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        }
        trap finish_step_timing EXIT
        mkdir -p "$DOWNLOAD_DIRECTORY"
        uv run --no-project --python 3.14 scripts/crates_io_transport_cli.py download \
          --crate "$CRATE_NAME" \
          --version "$RELEASE_VERSION" \
          --archive "$DOWNLOAD_DIRECTORY/$CRATE_NAME-$RELEASE_VERSION.crate" \
          --status-file "$DOWNLOAD_DIRECTORY/status" \
          --report-file "$DOWNLOAD_REPORT"
        printf 'attempts=%s\n' "$(jq -r '.attempts' "$DOWNLOAD_REPORT")" >>"$GITHUB_OUTPUT"
        printf 'status-class=%s\n' "$(jq -r '.status_class' "$DOWNLOAD_REPORT")" >>"$GITHUB_OUTPUT"
        printf 'elapsed-ms=%s\n' "$(jq -r '.elapsed_ms' "$DOWNLOAD_REPORT")" >>"$GITHUB_OUTPUT"

    - id: verify
      name: Verify downloaded registry bytes
      shell: bash
      env:
        CRATE_ARCHIVE: ${{ runner.temp }}/crates-io-download/${{ steps.candidate.outputs.package-name }}-${{ inputs.version }}.crate
        CRATE_NAME: ${{ steps.candidate.outputs.package-name }}
        RELEASE_VERSION: ${{ inputs.version }}
        CANDIDATE_SHA256: ${{ steps.candidate.outputs.sha256 }}
        DOWNLOAD_STATUS: ${{ runner.temp }}/crates-io-download/status
        VERIFICATION_PATH: ${{ runner.temp }}/crates-io-verification.json
      run: |
        set -euo pipefail
        started_ns="$(date +%s%N)"
        printf 'started_ns=%s\n' "$started_ns" >>"$GITHUB_OUTPUT"
        finish_step_timing() {
          printf 'ended_ns=%s\n' "$(date +%s%N)" >>"$GITHUB_OUTPUT"
        }
        trap finish_step_timing EXIT
        uv run --no-project --python 3.14 scripts/publish_crates_io_cli.py verify \
          --archive "$CRATE_ARCHIVE" \
          --crate "$CRATE_NAME" \
          --version "$RELEASE_VERSION" \
          --sha256 "$CANDIDATE_SHA256" \
          --status "$(cat "$DOWNLOAD_STATUS")" \
          --output "$VERIFICATION_PATH"
        sha256="$(jq -r '.sha256' "$VERIFICATION_PATH")"
        printf 'sha256=%s\n' "$sha256" >>"$GITHUB_OUTPUT"
