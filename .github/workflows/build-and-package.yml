---
name: Build and Package

'on':
  workflow_call:
    inputs:
      platform:
        description: Target platform identifier (linux, windows, or macos)
        required: true
        type: string
      runner:
        description: >-
          Runner label that should execute the job. Linux callers pass a
          Ubicloud label; Windows and macOS callers pass a GitHub-hosted one,
          because Ubicloud offers Linux runners only.
        required: true
        type: string
      target:
        description: Rust target triple to compile for
        required: true
        type: string
      bin-name:
        description: Name of the binary to build
        required: true
        type: string
      version:
        description: Version string used for packaging
        required: true
        type: string
      artifact-name:
        description: Name used when uploading workflow artefacts
        required: true
        type: string
      should-upload-workflow-artifacts:
        description: Whether workflow artefacts should be uploaded
        required: true
        type: boolean
      package-arch:
        description: Linux package architecture identifier (e.g. amd64)
        required: false
        type: string
      stage-target:
        description: Key used to look up staged artefacts
        required: false
        type: string
      package-maintainer:
        description: Maintainer value read from Cargo.toml
        required: false
        default: ''
        type: string
      package-homepage:
        description: Homepage value read from Cargo.toml
        required: false
        default: ''
        type: string
      package-license:
        description: Licence value read from Cargo.toml
        required: false
        default: ''
        type: string
      package-description:
        description: Description value read from Cargo.toml
        required: false
        default: ''
        type: string
      package-manifest:
        description: Cargo manifest resolved by the release metadata job
        required: false
        default: Cargo.toml
        type: string
      msi-arch:
        description: Architecture identifier for Windows MSI packaging
        required: false
        type: string
      artifact-suffix:
        description: Suffix appended to macOS package filenames
        required: false
        type: string
      python-version:
        description: Python version to install with uv on non-Linux platforms
        required: false
        # Matches the repository's Python 3.14 baseline (see the Makefile's
        # PYTHON_BASELINE variable).
        default: '3.14'
        type: string
      wix-extension-version:
        description: WiX Toolset extension version for Windows packaging
        required: false
        default: '7'
        type: string

jobs:
  build:
    name: Build ${{ inputs.platform }} artefacts
    runs-on: ${{ inputs.runner }}
    # Bounds every caller-selected shape, including the Ubicloud label
    # `release.build-linux` passes. This lane compiles a release binary
    # uncached on Windows and cross-packages elsewhere, so it is allowed the
    # same ceiling as the Windows merge gate rather than the merge gate's
    # 60 minutes. tests/workflow_contracts/runner_shape_test.py holds it
    # present, so deleting it cannot pass in silence.
    timeout-minutes: 90
    # The pinned action chain compiles, packages, and uploads workflow
    # artefacts. It neither publishes packages nor exchanges an OIDC token, so
    # the job token needs no write scope.
    permissions:
      contents: read
    # No compiler cache on any release lane.
    #
    # On Windows, sccache re-spawns rustc with the aarch64 target's
    # `--extern` and `-L` list and exceeds the operating system's
    # command-line limit, which nothing in this repository can shorten.
    #
    # Elsewhere the nested `setup-rust`, at the gate's pin, would select
    # the backend correctly, so the reason is cost: this lane runs on tag
    # pushes and the dry run only, and a cache read that rarely would not
    # pay back its setup.
    #
    # Release builds are infrequent, so these lanes run uncached rather than
    # unreliably. The merge gates keep their own caches; see
    # tests/workflow_contracts/cache_contract_data.py's SCCACHE_EXEMPT_LANE.
    env:
      BIN_NAME: ${{ inputs['bin-name'] }}
      VERSION: ${{ inputs.version }}
      # The pinned `rust-build-release` revision, restated here so the
      # `cargo-orthohelp` cache key can carry it. That action nests the shared
      # `setup-rust`, which provisions the checksum-verified `cargo-binstall`
      # into the same `~/.cargo/bin` the cache owns, so the entry must turn
      # over when this revision does.
      # tests/workflow_contracts/cache_ownership_test.py holds this value
      # equal to the `uses:` pin below.
      RUST_BUILD_RELEASE_PIN: 6cec89bac47a21cf756d68d638a9a510998e57f8
      # rust-build-release-v1 still nests a Node 20 setup-uv action, and the
      # promoted Node 24 runtime aborts inside libuv on Windows. The escape
      # hatch predates the move to GitHub-hosted Windows runners and is
      # retained unchanged so the packaging lane's behaviour is attributable
      # to the runner move alone; drop it once a Windows release run without
      # it succeeds. It stays empty on every other platform.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: >-
        ${{ inputs.platform == 'windows' && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The packaging lane hands the workspace to third-party build actions;
          # keeping the token out of .git/config denies them a reusable push
          # credential.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: ${{ inputs['python-version'] }}

      - name: Build release binary
        uses: leynos/shared-actions/.github/actions/rust-build-release@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          target: ${{ inputs.target }}
          bin-name: ${{ env.BIN_NAME }}
          project-dir: .
          manifest-path: Cargo.toml
          skip-man-page-discovery: 'true'
          # Forwarded to the nested `setup-rust`, whose own cache would
          # otherwise archive `target/${BUILD_PROFILE}`. No lane in this
          # repository archives a build tree; sccache owns compiler output.
          cache-provider: external
          # Off on every platform; see the job-level "No compiler cache on
          # any release lane" note above.
          use-sccache: 'false'

      - name: Report the glibc floor
        # The highest GLIBC symbol version a Linux binary requires is its
        # portability floor, and it follows whichever image the binary was
        # linked on. v0.1.0-beta3 measured GLIBC_2.39 for x86_64 (native on
        # Ubuntu 24.04) and GLIBC_2.18 for aarch64 (`cross`). Reporting it on
        # every run makes a change to either image visible in the summary.
        # `readelf` rather than `objdump`: it reads a foreign architecture's
        # ELF without a multi-architecture binutils. Only the version-needs
        # section is read: `--version-info` also prints the symbol and
        # definition sections, and a GLIBC_* the binary defines is no floor.
        if: inputs.platform == 'linux'
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_BIN_NAME: ${{ env.BIN_NAME }}
        run: uv run --no-project --python "$UV_PYTHON" scripts/report_glibc_floor.py

      - name: Restore cargo-orthohelp
        id: orthohelp_cache
        # Owns the installed tool binary. This lane is reached only by tag
        # pushes and the pull-request dry run, never by a push to `main`, so
        # unlike every other cache here it must publish from whichever run
        # installed the tool; the key is content-addressed by version, so
        # concurrent writers produce identical archives.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin
          # The `cargo-binstall` pin is part of the key, spelled as the
          # `rust-build-release` revision that provisions it. The entry owns
          # `~/.cargo/bin` as a directory, which is the repository's rule for
          # tool directories, and that directory holds `cargo-binstall` as
          # well as `cargo-orthohelp`. Keyed on the tool version alone, a bump
          # to the shared action's binstall version would not turn the entry
          # over, and the restore would put the older `cargo-binstall` back
          # over the one the action had just provisioned.
          #
          # Generation `v2`: the entry no longer carries a source-build target
          # directory, so its shape changed as well as its version.
          key: >-
            netsuke-orthohelp-v2-${{ runner.os }}-${{ runner.arch }}-0.10.0-${{ env.RUST_BUILD_RELEASE_PIN }}

      - name: Install cargo-orthohelp
        # Runs after `rust-build-release`, which nests the setup-rust action
        # that provisions checksum-verified cargo-binstall: `cargo binstall`
        # does not exist on the runner before that point. `cargo-orthohelp` is
        # first needed by the help-generation step below, so this ordering
        # costs nothing.
        #
        # No source build. `ortho-config` published no binaries until 0.9.1
        # (leynos/ortho-config#479), which is why this lane once carried a
        # documented exception to the no-source-build rule. 0.9.1 ships five
        # checksum-verified archives with working binstall metadata
        # (leynos/ortho-config#480), so the exception is retired: only 0.9.1
        # and later carry assets, and pinning below that would reintroduce a
        # compile. 0.10.0 publishes the same five archives.
        #
        # `--disable-strategies compile` is what makes that structural rather
        # than hopeful. The previous form listed the binary-only strategies it
        # preferred and fell through to a compile when they missed; this one
        # cannot compile at all, so a release that stops publishing assets
        # fails the lane instead of quietly building the tool from source.
        env:
          # Resolving the release asset costs one `api.github.com` call, and
          # unauthenticated calls are rate-limited per source address. The
          # macOS runners share addresses widely enough that both lanes hit
          # `403 Forbidden` on the first attempt of this change, retried for
          # two minutes, and failed. The job token lifts the limit to a
          # per-repository budget. `contents: read` is all it carries, which
          # is what reading a public release needs and nothing more.
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_VERSION: '0.10.0'
        shell: bash
        run: uv run --no-project --python "$UV_PYTHON" scripts/install_orthohelp.py

      - name: Validate cargo-orthohelp version
        shell: bash
        run: |
          set -euo pipefail
          cargo-orthohelp --version | grep -Eq '(^|[[:space:]])0\.10\.0([[:space:]]|$)'

      - name: Save cargo-orthohelp
        if: steps.orthohelp_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin
          # The `cargo-binstall` pin is part of the key, spelled as the
          # `rust-build-release` revision that provisions it. The entry owns
          # `~/.cargo/bin` as a directory, which is the repository's rule for
          # tool directories, and that directory holds `cargo-binstall` as
          # well as `cargo-orthohelp`. Keyed on the tool version alone, a bump
          # to the shared action's binstall version would not turn the entry
          # over, and the restore would put the older `cargo-binstall` back
          # over the one the action had just provisioned.
          #
          # Generation `v2`: the entry no longer carries a source-build target
          # directory, so its shape changed as well as its version.
          key: >-
            netsuke-orthohelp-v2-${{ runner.os }}-${{ runner.arch }}-0.10.0-${{ env.RUST_BUILD_RELEASE_PIN }}

      # `cargo-orthohelp` 0.10.0 compiles a bridge binary at generation time,
      # so `Generate release help` now runs a nested Cargo build that 0.9.1 did
      # not. On Windows that build resolves `link.exe` through `PATH`, and every
      # Bash step here starts with Git's `/usr/bin` ahead of Visual Studio,
      # whose coreutils `link` then answers and fails with "extra operand".
      # Export the MSVC toolchain variables and pin the linker by full path so
      # the nested build selects Visual Studio rather than whatever `PATH`
      # resolves first. This is upstream's own remedy: `leynos/ortho-config`
      # runs the same step in its own `.github/workflows/ci.yml`.
      #
      # It sits here, rather than earlier as upstream places it, because of the
      # aarch64 Windows lane. The exported `INCLUDE` and `LIB` point at x64
      # libraries, and `Build release binary` cross-compiles to
      # `aarch64-pc-windows-msvc`; those variables in scope would let the
      # release build link against x64 objects. Placing the step after the
      # release build avoids that, and costs nothing, because
      # `skip-man-page-discovery: 'true'` means the release build never runs the
      # nested bridge build — `Generate release help` is its only caller.
      #
      # `VsDevCmd.bat` sets its variables in the process it runs in, so the
      # values are read back from a child `cmd.exe` rather than expected to
      # appear in this shell.
      - name: Configure MSVC for nested Cargo builds
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          # `vswhere` takes one long flag list; splatting keeps each argument
          # on a line the workflow linter will accept.
          $vcTools = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          $installationQuery = @(
            '-latest', '-products', '*', '-requires', $vcTools,
            '-property', 'installationPath'
          )
          $installation = & $vswhere @installationQuery | Select-Object -First 1
          if (-not $installation) {
            throw 'vswhere did not find the Visual Studio C++ toolchain'
          }
          $vsDevCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd)) {
            throw 'Visual Studio did not provide VsDevCmd.bat'
          }
          $env:MSVC_VSDEVCMD = $vsDevCmd
          $devEnvironment = & $env:COMSPEC /d /s /c 'call "%MSVC_VSDEVCMD%" -arch=x64 -host_arch=x64 >nul && set'
          if ($LASTEXITCODE -ne 0) {
            throw 'VsDevCmd.bat could not configure the x64 MSVC environment'
          }
          $toolVariables = @(
            'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR',
            'VSINSTALLDIR', 'VSCMD_ARG_TGT_ARCH', 'WindowsSdkDir',
            'WindowsSDKVersion'
          )
          $selectedVariables = @{}
          foreach ($entry in $devEnvironment) {
            $separator = $entry.IndexOf('=')
            if ($separator -gt 0) {
              $name = $entry.Substring(0, $separator)
              if ($toolVariables -contains $name) {
                $selectedVariables[$name] = $entry.Substring($separator + 1)
              }
            }
          }
          if (-not $selectedVariables.ContainsKey('LIB')) {
            throw 'VsDevCmd.bat did not expose the MSVC library search path'
          }
          $sdkLibraries = $selectedVariables['LIB'] -split ';' | Where-Object { $_ }
          if (-not ($sdkLibraries | Where-Object { Test-Path (Join-Path $_ 'kernel32.lib') })) {
            throw 'VsDevCmd.bat did not expose the Windows SDK kernel32.lib search path'
          }
          foreach ($name in $toolVariables) {
            if ($selectedVariables.ContainsKey($name)) {
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$($selectedVariables[$name])" -Encoding utf8
            }
          }
          $linkerQuery = @(
            '-latest', '-products', '*', '-requires', $vcTools,
            '-find', 'VC\Tools\MSVC\**\bin\Hostx64\x64\link.exe'
          )
          $linker = & $vswhere @linkerQuery | Select-Object -First 1
          if (-not $linker) {
            throw 'vswhere did not find the x64 MSVC linker'
          }
          $linkerPath = $linker.Trim()
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $linkerPath) -Encoding utf8
          # The bridge build passes no `--target`, so it compiles for the host.
          # Both Windows lanes run on an x64 runner, so the x86_64 triple is the
          # host scope even for the arm64 release lane.
          $linkerSetting = "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linkerPath"
          Add-Content -Path $env:GITHUB_ENV -Value $linkerSetting -Encoding utf8

      - name: Generate release help
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          BIN_NAME: ${{ env.BIN_NAME }}
          HELP_MODULE_NAME: ${{ inputs.platform == 'windows' && 'Netsuke' || env.BIN_NAME }}
        run: |
          set -euo pipefail
          bash scripts/generate-release-help.sh \
            "$TARGET" \
            "$BIN_NAME" \
            "target/orthohelp/$TARGET/release" \
            "$HELP_MODULE_NAME"

      - name: Stage artefacts
        id: stage
        uses: leynos/shared-actions/.github/actions/stage-release-artefacts@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          config-file: .github/release-staging.toml
          target: ${{ inputs['stage-target'] }}
          ps-module-name: ${{ inputs.platform == 'windows' && 'Netsuke' || '' }}
          normalize-windows-paths: ${{ inputs.platform == 'windows' }}

      - name: Expose Windows global tool path
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $profileHome = [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile)
          $dotnetTools = Join-Path (Join-Path $profileHome '.dotnet') 'tools'
          $dotnetTools | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set Windows MSI release rank
        if: inputs.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $releaseRank = python scripts/windows_msi_release_rank.py $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "NETSUKE_RELEASE_RANK=$releaseRank" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Linux artefacts with dependencies
        if: inputs.platform == 'linux'
        uses: leynos/shared-actions/.github/actions/linux-packages@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          project-dir: .
          package-name: ${{ inputs['bin-name'] }}
          bin-name: ${{ inputs['bin-name'] }}
          target: ${{ inputs.target }}
          version: ${{ inputs.version }}
          formats: deb,rpm
          man-paths: ${{ steps.stage.outputs['man-path'] }}
          outdir: dist
          deb-depends: ninja-build
          rpm-depends: ninja-build
          maintainer: ${{ inputs['package-maintainer'] }}
          homepage: ${{ inputs['package-homepage'] }}
          license: ${{ inputs['package-license'] }}
          description: ${{ inputs['package-description'] }}

      - name: Prune packaging metadata
        if: inputs.platform == 'linux'
        shell: bash
        run: rm -rf dist/.man dist/nfpm.yaml

      - name: Install Python 3.14 for Linux package metadata validation
        if: inputs.platform == 'linux'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.14'
          enable-cache: false

      - name: Validate Linux package metadata
        if: inputs.platform == 'linux'
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs['bin-name'] }}
          PACKAGE_MAINTAINER: ${{ inputs['package-maintainer'] }}
          PACKAGE_HOMEPAGE: ${{ inputs['package-homepage'] }}
          PACKAGE_LICENSE: ${{ inputs['package-license'] }}
          PACKAGE_DESCRIPTION: ${{ inputs['package-description'] }}
          PACKAGE_MANIFEST: ${{ inputs['package-manifest'] }}
        run: |
          set -euo pipefail
          for field in PACKAGE_MAINTAINER PACKAGE_HOMEPAGE PACKAGE_LICENSE PACKAGE_DESCRIPTION; do
            if [[ -z "${!field}" ]]; then
              printf '::error title=Missing Linux package metadata::%s is empty\n' "$field"
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rpm
          uv run --no-project --python 3.14 \
            scripts/validate_linux_package_metadata.py \
            --dist dist \
            --manifest "$PACKAGE_MANIFEST" \
            --package-name "$PACKAGE_NAME" \
            --license-file LICENSE

      - name: Build Windows installer package
        if: inputs.platform == 'windows'
        id: package_windows
        uses: leynos/shared-actions/.github/actions/windows-package@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          wxs-path: installer/Package.wxs
          product-name: ${{ inputs['bin-name'] }}
          manufacturer: Leynos
          install-dir-name: ${{ inputs['bin-name'] }}
          application-path: ${{ steps.stage.outputs['binary-path'] }}
          license-rtf-path: ${{ steps.stage.outputs['license-path'] }}
          architecture: ${{ inputs['msi-arch'] }}
          version: ${{ inputs.version }}
          output-basename: ${{ inputs['bin-name'] }}
          output-directory: dist
          license-plaintext-path: LICENSE
          # The caller uploads the MSI with the architecture-specific bundle.
          upload-artefact: 'false'
          wix-extension-version: ${{ inputs['wix-extension-version'] }}

      - name: Build macOS installer package
        if: inputs.platform == 'macos'
        id: package_macos
        uses: leynos/shared-actions/.github/actions/macos-package@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          name: ${{ inputs['bin-name'] }}
          identifier: com.leynos.${{ inputs['bin-name'] }}
          binary: ${{ steps.stage.outputs['binary-path'] }}
          manpage: ${{ steps.stage.outputs['man-path'] }}
          license-file: LICENSE
          version: ${{ inputs.version }}

      - name: Stamp architecture into package name
        if: inputs.platform == 'macos'
        id: rename_macos_pkg
        shell: bash
        env:
          ARCHIVE_SUFFIX: ${{ inputs['artifact-suffix'] }}
          PKG_PATH: ${{ steps.package_macos.outputs.pkg-path }}
        run: |
          set -euo pipefail
          dest="dist/${BIN_NAME}-${VERSION}-${ARCHIVE_SUFFIX}.pkg"
          mkdir -p "$(dirname "$dest")"
          mv "$PKG_PATH" "$dest"

      - name: Upload Linux artefacts
        if: inputs.platform == 'linux' && inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] }}
          path: dist

      - name: Upload Windows artefacts
        if: inputs.platform == 'windows' && inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] }}
          path: |
            ${{ steps.stage.outputs['artifact-dir'] }}
            ${{ steps.package_windows.outputs['msi-path'] }}

      - name: Upload macOS artefacts
        if: inputs.platform == 'macos' && inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] }}
          path: |
            ${{ steps.stage.outputs['artifact-dir'] }}
            dist/${{ inputs['bin-name'] }}-${{ inputs.version }}-${{ inputs['artifact-suffix'] }}.pkg
