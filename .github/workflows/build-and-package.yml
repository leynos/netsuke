---
name: Build and Package

'on':
  workflow_call:
    inputs:
      platform:
        description: Target platform identifier (linux, windows, or macos)
        required: true
        type: string
      runner:
        description: >-
          Runner label that should execute the job. Linux callers pass a
          Ubicloud label; Windows and macOS callers pass a GitHub-hosted one,
          because Ubicloud offers Linux runners only.
        required: true
        type: string
      target:
        description: Rust target triple to compile for
        required: true
        type: string
      bin-name:
        description: Name of the binary to build
        required: true
        type: string
      version:
        description: Version string used for packaging
        required: true
        type: string
      artifact-name:
        description: Name used when uploading workflow artefacts
        required: true
        type: string
      should-upload-workflow-artifacts:
        description: Whether workflow artefacts should be uploaded
        required: true
        type: boolean
      package-arch:
        description: Linux package architecture identifier (e.g. amd64)
        required: false
        type: string
      stage-target:
        description: Key used to look up staged artefacts
        required: false
        type: string
      msi-arch:
        description: Architecture identifier for Windows MSI packaging
        required: false
        type: string
      artifact-suffix:
        description: Suffix appended to macOS package filenames
        required: false
        type: string
      python-version:
        description: Python version to install with uv on non-Linux platforms
        required: false
        # Matches the repository's Python 3.14 baseline (see the Makefile's
        # PYTHON_BASELINE variable).
        default: '3.14'
        type: string
      wix-extension-version:
        description: WiX Toolset extension version for Windows packaging
        required: false
        default: '7'
        type: string

jobs:
  build:
    name: Build ${{ inputs.platform }} artefacts
    runs-on: ${{ inputs.runner }}
    # The pinned action chain compiles, packages, and uploads workflow
    # artefacts. It neither publishes packages nor exchanges an OIDC token, so
    # the job token needs no write scope.
    permissions:
      contents: read
    env:
      BIN_NAME: ${{ inputs['bin-name'] }}
      VERSION: ${{ inputs.version }}
      # Compile through the compiler cache, as every other lane does. The
      # nested `rust-build-release` action installs sccache and exports the
      # GitHub Actions backend's credentials itself, so this job sets the
      # wrapper rather than installing a second sccache and creating a second
      # owner. Without it the packaging build reports zero compile requests.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: 4G
      MAN_ARCH: ${{ inputs['package-arch'] != '' && inputs['package-arch'] || 'unknown' }}
      # rust-build-release-v1 still nests a Node 20 setup-uv action, and the
      # promoted Node 24 runtime aborts inside libuv on Windows. The escape
      # hatch predates the move to GitHub-hosted Windows runners and is
      # retained unchanged so the packaging lane's behaviour is attributable
      # to the runner move alone; drop it once a Windows release run without
      # it succeeds. It stays empty on every other platform.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: >-
        ${{ inputs.platform == 'windows' && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        if: inputs.platform != 'linux'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        # v8.3.2
        with:
          python-version: ${{ inputs['python-version'] }}

      - name: Build release binary
        # KNOWN GAP: this action nests `setup-rust` at an older revision that
        # caches `target/${BUILD_PROFILE}` unconditionally and exposes no
        # `cache-provider` passthrough, so this is the one lane where a build
        # tree is still archived. Every lane this repository owns caches no
        # `target` tree at all. Closing the gap needs a shared-actions change
        # and cannot be done from here; see "Cache ownership and bounded CI
        # resources" in docs/developers-guide.md.
        uses: leynos/shared-actions/.github/actions/rust-build-release@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          target: ${{ inputs.target }}
          bin-name: ${{ env.BIN_NAME }}
          project-dir: .
          manifest-path: Cargo.toml
          skip-man-page-discovery: 'true'

      - name: Install cargo-orthohelp
        # Runs after `rust-build-release`, which nests the setup-rust action
        # that provisions checksum-verified cargo-binstall: `cargo binstall`
        # does not exist on the runner before that point. `cargo-orthohelp` is
        # first needed by the help-generation step below, so this ordering
        # costs nothing. Disabling the compile strategy makes a missing
        # prebuilt release a hard failure rather than a silent source build.
        shell: bash
        run: |
          set -euo pipefail
          cargo binstall --no-confirm --locked --disable-strategies compile \
            cargo-orthohelp@0.9.0

      - name: Validate cargo-orthohelp version
        shell: bash
        run: |
          set -euo pipefail
          cargo-orthohelp --version | grep -Eq '(^|[[:space:]])0\.9\.0([[:space:]]|$)'

      - name: Generate release help
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-release-help.sh \
            "${{ inputs.target }}" \
            "${{ env.BIN_NAME }}" \
            "target/orthohelp/${{ inputs.target }}/release" \
            "${{ inputs.platform == 'windows' && 'Netsuke' || env.BIN_NAME }}"

      - name: Stage artefacts
        id: stage
        uses: leynos/shared-actions/.github/actions/stage-release-artefacts@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          config-file: .github/release-staging.toml
          target: ${{ inputs['stage-target'] }}
          ps-module-name: ${{ inputs.platform == 'windows' && 'Netsuke' || '' }}
          normalize-windows-paths: ${{ inputs.platform == 'windows' }}

      - name: Capture staged paths
        id: stage_paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "binary_path=${{ steps.stage.outputs['binary-path'] }}"
            echo "man_path=${{ steps.stage.outputs['man-path'] }}"
            echo "license_path=${{ steps.stage.outputs['license-path'] }}"
            echo "artefact_dir=${{ steps.stage.outputs['artifact-dir'] }}"
            echo "powershell_help_dir=${{ steps.stage.outputs.powershell_help_dir }}"
          } >>"$GITHUB_OUTPUT"

      - name: Expose Windows global tool path
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $profileHome = [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile)
          $dotnetTools = Join-Path (Join-Path $profileHome '.dotnet') 'tools'
          $dotnetTools | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package Linux artefacts with dependencies
        if: inputs.platform == 'linux'
        uses: leynos/shared-actions/.github/actions/linux-packages@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          project-dir: .
          package-name: ${{ inputs['bin-name'] }}
          bin-name: ${{ inputs['bin-name'] }}
          target: ${{ inputs.target }}
          version: ${{ inputs.version }}
          formats: deb,rpm
          man-paths: ${{ steps.stage_paths.outputs.man_path }}
          outdir: dist
          deb-depends: ninja-build
          rpm-depends: ninja-build

      - name: Prune packaging metadata
        if: inputs.platform == 'linux'
        shell: bash
        run: rm -rf dist/.man dist/nfpm.yaml

      - name: Build Windows installer package
        if: inputs.platform == 'windows'
        id: package_windows
        uses: leynos/shared-actions/.github/actions/windows-package@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          product-name: ${{ inputs['bin-name'] }}
          manufacturer: Leynos
          install-dir-name: ${{ inputs['bin-name'] }}
          application-path: ${{ steps.stage_paths.outputs.binary_path }}
          license-rtf-path: ${{ steps.stage_paths.outputs.license_path }}
          architecture: ${{ inputs['msi-arch'] }}
          version: ${{ inputs.version }}
          output-basename: ${{ inputs['bin-name'] }}
          output-directory: dist
          license-plaintext-path: LICENSE
          upload-artefact: ${{ inputs['should-upload-workflow-artifacts'] }}
          wix-extension-version: ${{ inputs['wix-extension-version'] }}

      - name: Build macOS installer package
        if: inputs.platform == 'macos'
        id: package_macos
        uses: leynos/shared-actions/.github/actions/macos-package@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          name: ${{ inputs['bin-name'] }}
          identifier: com.leynos.${{ inputs['bin-name'] }}
          binary: ${{ steps.stage_paths.outputs.binary_path }}
          manpage: ${{ steps.stage_paths.outputs.man_path }}
          license-file: LICENSE
          version: ${{ inputs.version }}

      - name: Stamp architecture into package name
        if: inputs.platform == 'macos'
        id: rename_macos_pkg
        shell: bash
        env:
          ARCHIVE_SUFFIX: ${{ inputs['artifact-suffix'] }}
          PKG_PATH: ${{ steps.package_macos.outputs.pkg-path }}
        run: |
          set -euo pipefail
          dest="dist/${BIN_NAME}-${VERSION}-${ARCHIVE_SUFFIX}.pkg"
          mkdir -p "$(dirname "$dest")"
          mv "$PKG_PATH" "$dest"

      - name: Upload Linux artefacts
        if: inputs.platform == 'linux' && inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] }}
          path: dist

      - name: Upload Windows artefacts
        if: inputs.platform == 'windows' && inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] }}
          path: |
            ${{ steps.stage_paths.outputs.artefact_dir }}
            ${{ steps.package_windows.outputs['msi-path'] }}

      - name: Upload macOS artefacts
        if: inputs.platform == 'macos' && inputs['should-upload-workflow-artifacts']
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] }}
          path: |
            ${{ steps.stage_paths.outputs.artefact_dir }}
            dist/${{ inputs['bin-name'] }}-${{ inputs.version }}-${{ inputs['artifact-suffix'] }}.pkg
