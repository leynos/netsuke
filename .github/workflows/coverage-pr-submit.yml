---
name: Coverage (PR submission)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# The unprivileged CI workflow controls the uploaded coverage data, not this
# definition. This trusted default-branch workflow never checks out or executes
# PR content or artefact members, and treats the downloaded report as hostile.
permissions: {}

jobs:
  submit-coverage:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Check out trusted validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        # v8.3.2
        with:
          python-version: '3.14'
          enable-cache: 'false'
      - name: Start coverage artefact download telemetry
        id: start_download_coverage
        run: printf 'started_at_ms=%s\n' "$(date --utc +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Download PR coverage artefact
        id: download_coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # v8.0.1
        with:
          name: pr-coverage-lcov
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: coverage-artifact
      - name: Record coverage artefact download telemetry
        id: observe_download_coverage
        if: always()
        env:
          STARTED_AT_MS: ${{ steps.start_download_coverage.outputs.started_at_ms }}
          OUTCOME: ${{ steps.download_coverage.outcome }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ended_at_ms="$(date --utc +%s%3N)"
          started_at_ms="${STARTED_AT_MS:-$ended_at_ms}"
          duration_ms="$((ended_at_ms - started_at_ms))"
          printf 'duration_ms=%s\n' "$duration_ms" >> "$GITHUB_OUTPUT"
          telemetry="coverage-pr-submission operation=coverage-artifact-download duration_ms=$duration_ms"
          telemetry+=" workflow_run_id=$ORIGINATING_WORKFLOW_RUN_ID"
          telemetry+=" commit_sha=$ORIGINATING_COMMIT_SHA outcome=$OUTCOME"
          printf '%s\n' "$telemetry"
      - name: Start hostile coverage validation telemetry
        id: start_validate_coverage
        run: printf 'started_at_ms=%s\n' "$(date --utc +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Validate hostile coverage artefact
        id: validate_coverage
        run: make validate-coverage-artifact COVERAGE_ARTIFACT_DIR=coverage-artifact
      - name: Record hostile coverage validation telemetry
        id: observe_validate_coverage
        if: always()
        env:
          STARTED_AT_MS: ${{ steps.start_validate_coverage.outputs.started_at_ms }}
          OUTCOME: ${{ steps.validate_coverage.outcome }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ended_at_ms="$(date --utc +%s%3N)"
          started_at_ms="${STARTED_AT_MS:-$ended_at_ms}"
          duration_ms="$((ended_at_ms - started_at_ms))"
          printf 'duration_ms=%s\n' "$duration_ms" >> "$GITHUB_OUTPUT"
          telemetry="coverage-pr-submission operation=hostile-coverage-validation duration_ms=$duration_ms"
          telemetry+=" workflow_run_id=$ORIGINATING_WORKFLOW_RUN_ID"
          telemetry+=" commit_sha=$ORIGINATING_COMMIT_SHA outcome=$OUTCOME"
          printf '%s\n' "$telemetry"
      - name: Start CodeScene submission telemetry
        id: start_submit_coverage
        run: printf 'started_at_ms=%s\n' "$(date --utc +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Check coverage against CodeScene gates
        id: submit_coverage
        if: env.CS_ACCESS_TOKEN != ''
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@32c8ea649ea44d40119f348ad48861212532061f
        with:
          path: coverage-artifact/lcov.info
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/69281
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
      - name: Record CodeScene submission telemetry
        id: observe_submit_coverage
        if: always()
        env:
          STARTED_AT_MS: ${{ steps.start_submit_coverage.outputs.started_at_ms }}
          OUTCOME: ${{ steps.submit_coverage.outcome }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ended_at_ms="$(date --utc +%s%3N)"
          started_at_ms="${STARTED_AT_MS:-$ended_at_ms}"
          duration_ms="$((ended_at_ms - started_at_ms))"
          printf 'duration_ms=%s\n' "$duration_ms" >> "$GITHUB_OUTPUT"
          telemetry="coverage-pr-submission operation=codescene-submission duration_ms=$duration_ms"
          telemetry+=" workflow_run_id=$ORIGINATING_WORKFLOW_RUN_ID"
          telemetry+=" commit_sha=$ORIGINATING_COMMIT_SHA outcome=$OUTCOME"
          printf '%s\n' "$telemetry"
      - name: Report CodeScene coverage gate
        id: report_coverage
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        # v8.0.0
        env:
          SUBMISSION_OUTCOME: ${{ steps.submit_coverage.outcome }}
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_coverage.outcome }}
          ARTIFACT_VALIDATION_OUTCOME: ${{ steps.validate_coverage.outcome }}
          ARTIFACT_DOWNLOAD_DURATION_MS: ${{ steps.observe_download_coverage.outputs.duration_ms }}
          ARTIFACT_VALIDATION_DURATION_MS: ${{ steps.observe_validate_coverage.outputs.duration_ms }}
          SUBMISSION_DURATION_MS: ${{ steps.observe_submit_coverage.outputs.duration_ms }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_NAME: pr-coverage-lcov
        with:
          script: |
            const { coverageConclusion } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/codescene-coverage-outcome.js`,
            );
            const workflowRunId = process.env.ORIGINATING_WORKFLOW_RUN_ID;
            const commitSha = process.env.ORIGINATING_COMMIT_SHA;
            const artifactName = process.env.ARTIFACT_NAME;
            const downloadOutcome = process.env.ARTIFACT_DOWNLOAD_OUTCOME;
            const validationOutcome = process.env.ARTIFACT_VALIDATION_OUTCOME;
            const submissionOutcome = process.env.SUBMISSION_OUTCOME;
            const conclusion = coverageConclusion(
              downloadOutcome,
              validationOutcome,
              submissionOutcome,
            );
            const summary = [
              `Originating workflow run ID: ${workflowRunId}`,
              `Originating commit SHA: ${commitSha}`,
              `Artifact name: ${artifactName}`,
              `Download outcome: ${downloadOutcome}`,
              `Download duration (ms): ${process.env.ARTIFACT_DOWNLOAD_DURATION_MS}`,
              `Validation outcome: ${validationOutcome}`,
              `Validation duration (ms): ${process.env.ARTIFACT_VALIDATION_DURATION_MS}`,
              `Submission outcome: ${submissionOutcome}`,
              `Submission duration (ms): ${process.env.SUBMISSION_DURATION_MS}`,
              `Conclusion: ${conclusion}`,
            ].join('\n');
            core.setOutput('conclusion', conclusion);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CodeScene coverage',
              head_sha: context.payload.workflow_run.head_sha,
              external_id: workflowRunId,
              status: 'completed',
              conclusion,
              output: {
                title: 'CodeScene coverage',
                summary,
              },
            });
      - name: Summarize CodeScene coverage gate
        if: always()
        env:
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_NAME: pr-coverage-lcov
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_coverage.outcome }}
          ARTIFACT_VALIDATION_OUTCOME: ${{ steps.validate_coverage.outcome }}
          ARTIFACT_DOWNLOAD_DURATION_MS: ${{ steps.observe_download_coverage.outputs.duration_ms }}
          ARTIFACT_VALIDATION_DURATION_MS: ${{ steps.observe_validate_coverage.outputs.duration_ms }}
          SUBMISSION_OUTCOME: ${{ steps.submit_coverage.outcome }}
          SUBMISSION_DURATION_MS: ${{ steps.observe_submit_coverage.outputs.duration_ms }}
          CONCLUSION: ${{ steps.report_coverage.outputs.conclusion }}
        run: |
          {
            printf '### CodeScene coverage\n\n'
            printf '%s\n' "- Originating workflow run ID: $ORIGINATING_WORKFLOW_RUN_ID"
            printf '%s\n' "- Originating commit SHA: $ORIGINATING_COMMIT_SHA"
            printf '%s\n' "- Artifact name: $ARTIFACT_NAME"
            printf '%s\n' "- Download outcome: $ARTIFACT_DOWNLOAD_OUTCOME"
            printf '%s\n' "- Download duration (ms): $ARTIFACT_DOWNLOAD_DURATION_MS"
            printf '%s\n' "- Validation outcome: $ARTIFACT_VALIDATION_OUTCOME"
            printf '%s\n' "- Validation duration (ms): $ARTIFACT_VALIDATION_DURATION_MS"
            printf '%s\n' "- Submission outcome: $SUBMISSION_OUTCOME"
            printf '%s\n' "- Submission duration (ms): $SUBMISSION_DURATION_MS"
            printf '%s\n' "- Conclusion: $CONCLUSION"
          } >> "$GITHUB_STEP_SUMMARY"
  report-excluded-fork:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      checks: write
    steps:
      - name: Report excluded fork CodeScene coverage gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        # v8.0.0
        env:
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_NAME: pr-coverage-lcov
        with:
          script: |
            const workflowRunId = process.env.ORIGINATING_WORKFLOW_RUN_ID;
            const commitSha = process.env.ORIGINATING_COMMIT_SHA;
            const artifactName = process.env.ARTIFACT_NAME;
            const summary = [
              `Originating workflow run ID: ${workflowRunId}`,
              `Originating commit SHA: ${commitSha}`,
              `Artifact name: ${artifactName}`,
              'Download outcome: skipped',
              'Validation outcome: skipped',
              'Submission outcome: skipped',
              'Conclusion: neutral',
            ].join('\n');
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CodeScene coverage',
              head_sha: context.payload.workflow_run.head_sha,
              external_id: workflowRunId,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'CodeScene coverage',
                summary,
              },
            });
