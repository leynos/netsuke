---
name: Coverage (PR submission)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# The unprivileged CI workflow controls the uploaded coverage data, not this
# definition. This trusted default-branch workflow never checks out or executes
# PR content or artefact members, and treats the downloaded report as hostile.
permissions: {}

jobs:
  submit-coverage:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubicloud-standard-2-ubuntu-2404
    concurrency:
      group: codescene-coverage-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Check out trusted validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        # v8.3.2
        with:
          python-version: '3.14'
          enable-cache: 'false'
      - name: Start coverage artefact download telemetry
        id: start_download_coverage
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [".github/scripts/coverage_pr_submission.py", "start-telemetry"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Download PR coverage artefact
        id: download_coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # v8.0.1
        with:
          name: pr-coverage-lcov
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: coverage-artifact
          skip-decompress: true
      - name: Record coverage artefact download telemetry
        id: observe_download_coverage
        if: always()
        env:
          STARTED_AT_MS: ${{ steps.start_download_coverage.outputs.started_at_ms }}
          OUTCOME: ${{ steps.download_coverage.outcome }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          NETSUKE_CODESCENE_COVERAGE_METRICS_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-metrics.jsonl
          NETSUKE_CODESCENE_COVERAGE_TRACES_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-traces.jsonl
          OPERATION: coverage-artifact-download
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [
              ".github/scripts/coverage_pr_submission_observability.py",
              "record-telemetry",
          ]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Start hostile coverage validation telemetry
        id: start_validate_coverage
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [".github/scripts/coverage_pr_submission.py", "start-telemetry"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Validate hostile coverage artefact
        id: validate_coverage
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [
              ".github/scripts/coverage_pr_submission.py",
              "validate-artefact",
              "--artifact-directory",
              "coverage-artifact",
          ]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Record hostile coverage validation telemetry
        id: observe_validate_coverage
        if: always()
        env:
          STARTED_AT_MS: ${{ steps.start_validate_coverage.outputs.started_at_ms }}
          OUTCOME: ${{ steps.validate_coverage.outcome }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          NETSUKE_CODESCENE_COVERAGE_METRICS_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-metrics.jsonl
          NETSUKE_CODESCENE_COVERAGE_TRACES_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-traces.jsonl
          OPERATION: hostile-coverage-validation
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [
              ".github/scripts/coverage_pr_submission_observability.py",
              "record-telemetry",
          ]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Start CodeScene submission telemetry
        id: start_submit_coverage
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [".github/scripts/coverage_pr_submission.py", "start-telemetry"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Check coverage against CodeScene gates
        id: submit_coverage
        if: env.CS_ACCESS_TOKEN != ''
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@32c8ea649ea44d40119f348ad48861212532061f
        with:
          path: validated-coverage/lcov.info
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/69281
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
      - name: Record CodeScene submission telemetry
        id: observe_submit_coverage
        if: always()
        env:
          STARTED_AT_MS: ${{ steps.start_submit_coverage.outputs.started_at_ms }}
          OUTCOME: ${{ steps.submit_coverage.outcome }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          NETSUKE_CODESCENE_COVERAGE_METRICS_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-metrics.jsonl
          NETSUKE_CODESCENE_COVERAGE_TRACES_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-traces.jsonl
          OPERATION: codescene-submission
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [
              ".github/scripts/coverage_pr_submission_observability.py",
              "record-telemetry",
          ]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Start CodeScene Check Run publication telemetry
        id: start_report_coverage
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [".github/scripts/coverage_pr_submission.py", "start-telemetry"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Report CodeScene coverage gate
        id: report_coverage
        if: always()
        env:
          SUBMISSION_OUTCOME: ${{ steps.submit_coverage.outcome }}
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_coverage.outcome }}
          ARTIFACT_VALIDATION_OUTCOME: ${{ steps.validate_coverage.outcome }}
          ARTIFACT_DOWNLOAD_DURATION_MS: ${{ steps.observe_download_coverage.outputs.duration_ms }}
          ARTIFACT_VALIDATION_DURATION_MS: ${{ steps.observe_validate_coverage.outputs.duration_ms }}
          SUBMISSION_DURATION_MS: ${{ steps.observe_submit_coverage.outputs.duration_ms }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_NAME: pr-coverage-lcov
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [".github/scripts/coverage_pr_submission.py", "report-coverage"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Record CodeScene Check Run publication telemetry
        id: observe_report_coverage
        if: always()
        env:
          STARTED_AT_MS: ${{ steps.start_report_coverage.outputs.started_at_ms }}
          OUTCOME: ${{ steps.report_coverage.outcome }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          NETSUKE_CODESCENE_COVERAGE_METRICS_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-metrics.jsonl
          NETSUKE_CODESCENE_COVERAGE_TRACES_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-traces.jsonl
          OPERATION: codescene-check-run-publication
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [
              ".github/scripts/coverage_pr_submission_observability.py",
              "record-telemetry",
          ]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Summarize CodeScene coverage gate
        if: always()
        env:
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_NAME: pr-coverage-lcov
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.download_coverage.outcome }}
          ARTIFACT_VALIDATION_OUTCOME: ${{ steps.validate_coverage.outcome }}
          ARTIFACT_DOWNLOAD_DURATION_MS: ${{ steps.observe_download_coverage.outputs.duration_ms }}
          ARTIFACT_VALIDATION_DURATION_MS: ${{ steps.observe_validate_coverage.outputs.duration_ms }}
          SUBMISSION_OUTCOME: ${{ steps.submit_coverage.outcome }}
          SUBMISSION_DURATION_MS: ${{ steps.observe_submit_coverage.outputs.duration_ms }}
          CHECK_RUN_PUBLICATION_OUTCOME: ${{ steps.report_coverage.outcome }}
          CHECK_RUN_PUBLICATION_DURATION_MS: ${{ steps.observe_report_coverage.outputs.duration_ms }}
          CONCLUSION: ${{ steps.report_coverage.outputs.conclusion }}
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [".github/scripts/coverage_pr_submission.py", "summarize-coverage"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Upload CodeScene coverage metrics
        if: >-
          always() && steps.observe_download_coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        env:
          NETSUKE_CODESCENE_COVERAGE_METRICS_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-metrics.jsonl
        with:
          name: codescene-pr-coverage-metrics
          path: ${{ env.NETSUKE_CODESCENE_COVERAGE_METRICS_FILE }}
          if-no-files-found: error
      - name: Upload CodeScene coverage traces
        if: >-
          always() && steps.observe_download_coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        env:
          NETSUKE_CODESCENE_COVERAGE_TRACES_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-traces.jsonl
        with:
          name: codescene-pr-coverage-traces
          path: ${{ env.NETSUKE_CODESCENE_COVERAGE_TRACES_FILE }}
          if-no-files-found: error
  report-excluded-fork:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubicloud-standard-2-ubuntu-2404
    concurrency:
      group: codescene-coverage-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      checks: write
    steps:
      # The fork publication records the same bounded, fixed-label telemetry as
      # the same-repository publication above. It stays log-only: uploading the
      # metrics and traces needs `actions: write`, and this job holds only
      # `checks: write`, so widening its permissions to export them would make
      # the excluded-fork path more privileged than the publication it makes.
      - name: Start excluded fork Check Run publication telemetry
        id: start_report_excluded_fork
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [".github/scripts/coverage_pr_submission.py", "start-telemetry"]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Report excluded fork CodeScene coverage gate
        id: report_excluded_fork
        env:
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_NAME: pr-coverage-lcov
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [
              ".github/scripts/coverage_pr_submission.py",
              "report-excluded-fork",
          ]
          runpy.run_path(sys.argv[0], run_name="__main__")
      - name: Record excluded fork Check Run publication telemetry
        id: observe_report_excluded_fork
        if: always()
        env:
          STARTED_AT_MS: ${{ steps.start_report_excluded_fork.outputs.started_at_ms }}
          OUTCOME: ${{ steps.report_excluded_fork.outcome }}
          ORIGINATING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINATING_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          NETSUKE_CODESCENE_COVERAGE_METRICS_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-metrics.jsonl
          NETSUKE_CODESCENE_COVERAGE_TRACES_FILE: >-
            ${{ runner.temp }}/codescene-pr-coverage-traces.jsonl
          OPERATION: codescene-check-run-publication
        shell: python
        run: |
          import runpy
          import sys
          sys.argv = [
              ".github/scripts/coverage_pr_submission_observability.py",
              "record-telemetry",
          ]
          runpy.run_path(sys.argv[0], run_name="__main__")
