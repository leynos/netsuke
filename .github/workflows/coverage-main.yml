---
name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push; pull requests run the
# changed-line gate (`cs-coverage check`) in ci.yml instead. This
# workflow also advances the coverage ratchet baseline: caches saved on
# main are readable by every pull-request run, so the baseline written
# here is the one PR ratchet checks compare against.

on:
  push:
    branches: [main]

jobs:
  coverage-upload:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # `ubicloud-standard-2-ubuntu-2404` supplies two vCPUs; the coverage
      # action derives its own worker count from this lane constant.
      LINUX_LANE_VCPUS: '2'
      NETSUKE_RUNNER_IMAGE: ubuntu2404
      # The instrumented coverage build compiles through the same sccache
      # store as the ordinary debug build: the two shapes differ only by
      # flags, which sccache hashes, so they coexist without a `target`
      # archive and neither shape is left uncached.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_CACHE_SIZE: 4G
      # Keep the main baseline aligned with pull-request coverage instead of
      # silently skipping real-Ninja integration tests.
      NETSUKE_REQUIRE_NINJA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Export sccache credentials
        # Before the installer, so before anything can start the server: a
        # server started without these stays on local disk all job.
        uses: ./.github/actions/sccache-gha-credentials
      - name: Render cache key
        # Renders the same Cargo download-store key that
        # `.github/actions/linux-gate-cache` renders for the merge gate: this
        # job runs on the same shape and image, so it reads the generation the
        # gate publishes on the trunk. It is a reader only.
        # tests/workflow_contracts/cache_ownership_test.py holds the shapes
        # equal. The toolchain is spelled here rather than taken from
        # NETSUKE_RUST_TOOLCHAIN because coverage must not declare that
        # variable; tests/polonius_toolchain_contract.rs holds it absent.
        run: |
          set -euo pipefail
          lane="${RUNNER_OS}-${RUNNER_ARCH}-${RUNNER_ENVIRONMENT}-${NETSUKE_RUNNER_IMAGE}"
          sources="$(sha256sum Cargo.lock rust-toolchain.toml | sha256sum | cut -c1-16)"
          {
            printf 'CARGO_CACHE_PREFIX=netsuke-cargo-v1-%s-nightly-2026-08-23-\n' "${lane}"
            printf 'CARGO_CACHE_KEY=netsuke-cargo-v1-%s-nightly-2026-08-23-%s\n' \
              "${lane}" "${sources}"
          } >> "$GITHUB_ENV"
      - name: Restore Cargo download store
        id: cargo_registry
        # Restore only. `build-test` on the trunk is the single writer of this
        # key, so this job never races it for a reservation. The uv download
        # and tool stores are deliberately uncached here: they live under
        # `~/.local/share`, which the merge gate's Whitaker cache owns, and a
        # second owner would make warmth and eviction unknowable.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: ${{ env.CARGO_CACHE_PREFIX }}
      - name: Record cache observations
        if: always()
        env:
          REGISTRY_HIT: ${{ steps.cargo_registry.outputs.cache-hit }}
        run: |
          {
            printf '### Cache observations\n\n'
            # Backticks are literal Markdown code spans in the summary, not
            # command substitution.
            # shellcheck disable=SC2016
            printf -- '- registry key: `%s` hit: `%s`\n' \
              "${CARGO_CACHE_KEY}" "${REGISTRY_HIT:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install sccache
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: sccache@0.16.0
          fallback: none
      - name: Setup Rust
        # Pinned to the shared-actions revision that adds `cache-provider`.
        uses: leynos/shared-actions/.github/actions/setup-rust@7d46a399558914f5a05074e55a560fec0269fd0d
        with:
          # Match rust-toolchain.toml: the tree needs the nightly-default
          # Polonius borrow checker (see
          # docs/adr-006-adopt-polonius-nightly-toolchain.md).
          toolchain: nightly-2026-08-23
          # Preserve warnings-as-errors through toolchain setup;
          # cargo-llvm-cov appends its instrumentation flags to this value.
          rustflags: -D warnings
          cache-provider: external
          use-sccache: 'false'
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - name: Reset sccache statistics
        run: sccache --zero-stats
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@7d46a399558914f5a05074e55a560fec0269fd0d
        with:
          language: rust
          output-path: lcov.info
          format: lcov
          cache-provider: external
          # The same set the pull-request gate measures, so the baseline this
          # job writes is comparable with what the ratchet checks against.
          all-features: 'true'
          all-targets: 'true'
          doctests: 'true'
          with-ratchet: 'true'
      - name: Show sccache statistics
        # Zero compile requests here would mean the instrumented build never
        # reached the compiler cache, which is a failed integration rather
        # than a quiet no-op.
        if: always()
        run: |
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format=json > sccache-stats.json
          {
            printf '### sccache\n\n```text\n'
            cat sccache-stats.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@7d46a399558914f5a05074e55a560fec0269fd0d
        with:
          path: lcov.info
          format: lcov
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
