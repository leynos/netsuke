---
name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push; pull requests run the
# changed-line gate (`cs-coverage check`) in ci.yml instead. This
# workflow also advances the coverage ratchet baseline: caches saved on
# main are readable by every pull-request run, so the baseline written
# here is the one PR ratchet checks compare against.

on:
  push:
    branches: [main]

jobs:
  coverage-upload:
    runs-on: namespace-profile-netsuke
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # Keep the main baseline aligned with pull-request coverage instead of
      # silently skipping real-Ninja integration tests.
      NETSUKE_REQUIRE_NINJA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Namespace cache volume
        id: namespace_cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.cache/uv
            ~/.local/share/uv
      - name: Setup Rust
        # Pinned to the shared-actions revision that adds `cache-provider`.
        uses: leynos/shared-actions/.github/actions/setup-rust@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          # Match rust-toolchain.toml: the tree needs the nightly-default
          # Polonius borrow checker (see
          # docs/adr-006-adopt-polonius-nightly-toolchain.md).
          toolchain: nightly-2026-08-23
          # Preserve warnings-as-errors through toolchain setup;
          # cargo-llvm-cov appends its instrumentation flags to this value.
          rustflags: -D warnings
          cache-provider: external
          use-sccache: 'false'
      - name: Summarize Namespace cache
        if: always()
        run: |
          echo '### Namespace cache' >> "$GITHUB_STEP_SUMMARY"
          echo "- cache-hit: ${{ steps.namespace_cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          language: rust
          output-path: lcov.info
          format: lcov
          cache-provider: external
          with-ratchet: 'true'
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          path: lcov.info
          format: lcov
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
