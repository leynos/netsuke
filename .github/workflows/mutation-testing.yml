---
name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
# Scheduled runs mutate only files changed within the detection window;
# manual dispatch runs mutate everything, fanned out across shards. To
# test a branch, select it in the Actions "Run workflow" control.
#
# The `with:` block provisions the worker's toolchain as well as
# configuring the run. This worker is not the CI merge gate: it gets its
# own runner, so a tool installed for `ci.yml` is absent here. The
# repository's build targets all depend on `check-build-tools`, which
# requires the pinned mold, so the caller installs it and then re-runs the
# preflight to prove it. See the input comments below.

on:
  schedule:
    - cron: "5 3 * * *"  # Daily, 03:05 UTC
  workflow_dispatch:

# Default the token to no scopes; the job opts in explicitly.
permissions: {}

# Serialize runs per ref: a dispatch during a scheduled run (or vice
# versa) queues rather than racing. Runs are informational, so queued
# runs wait instead of cancelling.
concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write  # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@0606ca899ce2995a0c4bc78e660e80832e6e8855
    with:
      # test_support is deliberately omitted from extra crates: it is a
      # test-fixture crate whose survivors are noise.
      # Kani-only verification modules gated behind #[cfg(kani)] mod
      # declarations; cargo-mutants does not evaluate that cfg, so
      # mutants there would compile to nothing and survive as noise.
      exclude-globs: "src/ir/cycle/verification.rs,src/ir/cmd_interpolate/verification.rs,\
        src/ir/from_manifest/verification.rs,src/ir/graph/kani_map.rs"
      # Match the CI baseline (`make test` runs --all-features) so
      # feature-gated tests (legacy-digests) run against mutants.
      extra-args: "--all-features"
      # Install the pinned mold through setup-rust, which appends it to
      # GITHUB_PATH for every later step. Every build target here depends
      # on the `check-build-tools` prerequisite, so without this the
      # worker has no mold and the baseline dies at the preflight before a
      # single mutant is evaluated. Provisioning a linker on another CI
      # job provisions that job's worker, not this one.
      #
      # The input is a string, not a boolean: the shared workflow declares
      # it `type: string`, and a bare `true` would be rejected at
      # workflow-call time.
      install-mold: 'true'
      # Re-run the repository's own preflight inside the worker, so a mold
      # that is missing, unrunnable, or off the `tools/mold/VERSION` pin
      # says so before the baseline compiles rather than surfacing later
      # as an opaque linker failure. The version is read from that file,
      # so a bump cannot leave this caller asserting a stale one.
      #
      # Both flag variables are printed for the run log. Which source
      # actually selects the linker is an open question upstream
      # (leynos/shared-actions#544): setup-rust exports
      # `RUSTFLAGS="-D warnings"`, and Cargo takes `RUSTFLAGS` over every
      # `rustflags` table in `.cargo/config.toml`, so the
      # `-Clink-arg=-fuse-ld=mold` entry there may not apply. Printing the
      # values records which happened instead of assuming it.
      #
      # Nothing here sets or overrides either variable: overriding
      # RUSTFLAGS would displace the project configuration that the build
      # standard is defined by.
      #
      # So `check-build-tools` proves the pinned mold is *installed*, not
      # that Cargo *selects* it. Two measurements bound the gap. A
      # `--verbose` baseline log from run 38323348294 shows
      # `-Clink-arg=-fuse-ld=mold` on 0 of 569 rustc invocations with
      # `RUSTFLAGS=-D warnings` on all 569, so selection is absent on the
      # worker. And no shared revision can supply it: the pinned
      # mutation-cargo.yml and its tip (aea9c14c24b7) each declare fifteen
      # `workflow_call` inputs and neither declares `rustflags`; #544 is
      # open with no fixing commit. Restoring selection needs an upstream
      # input, so there is nothing to pin and the gap stays recorded
      # rather than worked around here.
      setup-commands: |
        make check-build-tools
        printf "RUSTFLAGS=%s\n" "${RUSTFLAGS-<unset>}"
        printf "CARGO_ENCODED_RUSTFLAGS=%s\n" "${CARGO_ENCODED_RUSTFLAGS-<unset>}"
