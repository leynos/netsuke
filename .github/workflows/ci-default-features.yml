---
name: CI (default features)

# The default-feature lane of the merge gate. Release binaries build Netsuke's
# default feature set (`release.yml` runs `cargo build --locked --bin
# netsuke`), and that set leaves out the `lint` feature, which carries
# `netsuke check`, until v0.2.0; see
# docs/adr-042-manifest-linting-under-netsuke-check.md. Every other lane
# builds `--all-features`, so without this one a release could ship code that
# only compiles, or only stays warning-free, with every feature enabled.
#
# The lane is uninstrumented on purpose. Coverage measures the all-features
# build in `ci.yml`; the evidence here is that the release feature set passes
# rustdoc, Clippy, and the test suite with warnings denied. It is the one
# Linux test lane outside the coverage producer, and
# tests/workflow_contracts/ci_default_features_test.py holds it to that shape.
#
# It lives in its own reusable workflow for the reason ci-windows.yml does:
# `ci.yml` is past its line budget. Version pins stay in the caller and arrive
# as inputs, so there is exactly one place to edit each one.

'on':
  workflow_call:
    inputs:
      nextest-version:
        description: cargo-nextest release the caller pins for the whole gate
        required: true
        type: string

env:
  NEXTEST_VERSION: ${{ inputs['nextest-version'] }}

jobs:
  default-features:
    name: Default features
    # A pull request from a fork cannot obtain a Ubicloud runner, so the fork
    # arm falls back to a GitHub-hosted one, as in `ci.yml`'s `build-test`.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-4-ubuntu-2404' }}
    # A cold build of both feature sets' worth of targets, rustdoc, Clippy, and
    # the full suite: measured well under this ceiling, which exists so a hung
    # nested Cargo build fails the lane instead of holding a runner for hours.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      LINUX_LANE_VCPUS: '4'
      BUILD_JOBS: -j 4
      CARGO_BUILD_JOBS: '4'
      NEXTEST_TEST_THREADS: '4'
      NEXTEST_PROFILE: ci
      NETSUKE_RUST_TOOLCHAIN: nightly-2026-08-23
      # Ninja-dependent tests skip silently without it; this lane must run
      # them, as `build-test` does.
      NETSUKE_REQUIRE_NINJA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install test shell dependencies
        # Recipe tests run under GNU awk, as in `build-test`.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gawk
          test_shell_bin="${RUNNER_TEMP}/netsuke-test-bin"
          mkdir --parents "${test_shell_bin}"
          install --mode=0755 "$(command -v gawk)" "${test_shell_bin}/awk"
          echo "${test_shell_bin}" >> "${GITHUB_PATH}"
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          toolchain: ${{ env.NETSUKE_RUST_TOOLCHAIN }}
          rustflags: -D warnings
          cache-provider: external
          use-sccache: 'false'
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - name: Install cargo-nextest
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73  # v2.87.17
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - name: Install the build standard
        # The pinned `mold` is the repository's default linker.
        run: make install-build-tools
      - name: Lint with the default features
        run: make lint-default-features
      - name: Test with the default features
        run: make test-default-features
