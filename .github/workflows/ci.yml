---
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Start every job from an empty token and let each one opt in. Both jobs
# below, and the reusable Windows workflow's caller, take `contents: read`.
permissions: {}

env:
  # Single source of truth for the cargo-nextest pin. `make test` runs the
  # non-doctest suite through nextest, so every job that installs it reads
  # this value. Declared once at workflow scope so the documented
  # AGENTS.md `sed` extraction yields exactly one version.
  NEXTEST_VERSION: '0.9.133'
  # Pins for the Python lint and typecheck gates. Make's `?=` assignments
  # yield to the environment, so these values control the versions the `make`
  # targets below run under. tests/workflow_contracts/python_toolchain_sync_test.py
  # holds these equal to the Makefile defaults so CI and local runs cannot
  # drift apart.
  RUFF_VERSION: '0.16.4'
  TY_VERSION: '0.0.74'
  PYTHON_BASELINE: '3.14'
  # `make check-fmt` verifies Markdown formatting through
  # scripts/check-markdown-format.sh, which shells out to mdtablefix. Pin it
  # once so both formatter jobs produce the same canonical output.
  MDTABLEFIX_VERSION: '0.5.0'

jobs:
  build-test:
    runs-on: namespace-profile-netsuke-ci
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # The attached Namespace profile has four vCPUs. Bound compilation and
      # nextest separately so test workers do not oversubscribe it.
      BUILD_JOBS: -j 4
      NEXTEST_BUILD_JOBS: --build-jobs 4
      NEXTEST_TEST_JOBS: -j 4
      RUSTC_WRAPPER: sccache
      # The tree requires the Polonius borrow checker, which nightly enables by
      # default (see docs/adr-006-adopt-polonius-nightly-toolchain.md), so CI
      # builds with the dated nightly pinned in rust-toolchain.toml.
      NETSUKE_RUST_TOOLCHAIN: nightly-2026-08-23
      YAMLLINT_VERSION: '1.38.0'
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin
      # Real-Ninja integration coverage must not silently skip when a runner
      # image lacks the backend executable.
      NETSUKE_REQUIRE_NINJA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the deferred cs-coverage check step can reach
          # the pull request's merge base once the gate is wired in.
          fetch-depth: 0
      - name: Set up Namespace cache volume
        id: namespace_cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547
        with:
          # Explicit paths only. The `rust` mode mounts Cargo's disposable
          # `target` directory, and the `uv` mode probes a tool this job
          # redirects with UV_CACHE_DIR, so both are unusable here.
          cache: |
            apt
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.cache/sccache
            ~/.local/share/whitaker
            .typos-oxendict-base.json
            .typos-oxendict-base.toml
            .uv-bin
            .uv-cache
            .uv-tools
            actionlint
      - name: Summarize Namespace cache
        if: always()
        run: |
          echo '### Namespace cache' >> "$GITHUB_STEP_SUMMARY"
          echo "- cache-hit: ${{ steps.namespace_cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install test shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gawk

          # Ubuntu exposes awk through an alternatives symlink outside
          # /usr/bin. The capability-backed sandbox probe deliberately cannot
          # follow a symlink that escapes its containing directory, so expose
          # the packaged binary as a regular executable on the job PATH.
          test_shell_bin="${RUNNER_TEMP}/netsuke-test-bin"
          mkdir --parents "${test_shell_bin}"
          install --mode=0755 "$(command -v gawk)" "${test_shell_bin}/awk"
          echo "${test_shell_bin}" >> "${GITHUB_PATH}"
          export PATH="${test_shell_bin}:${PATH}"

          command -v awk
          awk --version
      - name: Install sccache
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: sccache@0.16.0
          fallback: none
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          toolchain: ${{ env.NETSUKE_RUST_TOOLCHAIN }}
          # Preserve warnings-as-errors through toolchain setup.
          rustflags: -D warnings
          cache-provider: external
          use-sccache: 'false'
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - name: Reset sccache statistics
        run: sccache --zero-stats
      - name: Show rustc version
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Show Ninja version
        run: ninja --version
      - name: Install mdtablefix
        # Required by `make check-fmt`. The Namespace cache volume owns
        # `~/.cargo/bin`, so a warm run finds the pinned binary already
        # present. `cargo-binstall` is checksum-verified by setup-rust and
        # fetches a prebuilt release; CI never compiles mdtablefix.
        run: |
          expected_mdtablefix_version="mdtablefix ${MDTABLEFIX_VERSION}"
          installed_mdtablefix_version=""
          if command -v mdtablefix >/dev/null 2>&1; then
            installed_mdtablefix_version="$(mdtablefix --version 2>/dev/null | tr -d '\r')"
          fi
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            cargo binstall --no-confirm --locked --disable-strategies compile \
              "mdtablefix@${MDTABLEFIX_VERSION}"
          fi
          installed_mdtablefix_version="$(mdtablefix --version | tr -d '\r')"
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            echo "expected ${expected_mdtablefix_version}, got ${installed_mdtablefix_version}" >&2
            exit 1
          fi
      - name: Setup uv
        # Installed before the Format step: `make check-fmt` and `make lint`
        # run the uv-driven Ruff, Pylint, df12, and ambrleaks gates.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: ${{ env.PYTHON_BASELINE }}
          # The Namespace volume already owns the uv download and tool
          # stores, so a second GitHub-backed cache would duplicate it.
          enable-cache: 'false'
      - name: Install yamllint
        # The Namespace volume owns the uv download store, tool store, and
        # shim directory, so a warm run reuses the pinned environment.
        run: |
          uv tool install "yamllint==${YAMLLINT_VERSION}"
          echo "${UV_TOOL_BIN_DIR}" >> "$GITHUB_PATH"
      - name: Download actionlint
        id: get_actionlint
        # The Namespace volume owns `actionlint`. Reuse it only when the
        # cached binary reports the pinned version, so a version bump cannot
        # be satisfied by a stale executable.
        run: |
          set -euo pipefail
          readonly ACTIONLINT_VERSION='1.7.12'
          if [[ -x ./actionlint ]] \
            && [[ "$(./actionlint --version | head --lines=1)" == "${ACTIONLINT_VERSION}" ]]; then
            echo "actionlint ${ACTIONLINT_VERSION} restored from the cache volume"
            exit 0
          fi
          readonly ACTIONLINT_SHA256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          readonly ACTIONLINT_INSTALLER_COMMIT='914e7df21a07ef503a81201c76d2b11c789d3fca'
          readonly ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          readonly ACTIONLINT_RAW_BASE='https://raw.githubusercontent.com/rhysd/actionlint'
          readonly ACTIONLINT_SCRIPT='scripts/download-actionlint.bash'
          readonly ACTIONLINT_INSTALLER_URL="${ACTIONLINT_RAW_BASE}/${ACTIONLINT_INSTALLER_COMMIT}/${ACTIONLINT_SCRIPT}"
          readonly ACTIONLINT_RELEASE_ROOT='https://github.com/rhysd/actionlint/releases/download'
          readonly ACTIONLINT_RELEASE_BASE="${ACTIONLINT_RELEASE_ROOT}/v${ACTIONLINT_VERSION}"
          readonly ACTIONLINT_RELEASE_URL="${ACTIONLINT_RELEASE_BASE}/${ACTIONLINT_ARCHIVE}"
          ACTIONLINT_INSTALLER_PATH="$(mktemp)"
          ACTIONLINT_ARCHIVE_PATH="$(mktemp)"
          trap 'rm -f "${ACTIONLINT_INSTALLER_PATH}" "${ACTIONLINT_ARCHIVE_PATH}"' EXIT
          # Feed the verified archive to reviewed installer without second download.
          curl() {
            if [[ "${*: -1}" == "${ACTIONLINT_RELEASE_URL}" ]]; then
              cat "${ACTIONLINT_ARCHIVE_PATH}"
            else
              command curl "$@"
            fi
          }
          export -f curl
          command curl --fail --location --show-error --output "${ACTIONLINT_INSTALLER_PATH}" \
            "${ACTIONLINT_INSTALLER_URL}"
          command curl --fail --location --show-error --output "${ACTIONLINT_ARCHIVE_PATH}" \
            "${ACTIONLINT_RELEASE_URL}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${ACTIONLINT_ARCHIVE_PATH}" | sha256sum --check --
          bash "${ACTIONLINT_INSTALLER_PATH}" "${ACTIONLINT_VERSION}"
        shell: bash
      - name: Install Nixie
        uses: >-
          leynos/shared-actions/.github/actions/install-nixie@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          python-version: '3.14'
      - name: Markdown formatter checker tests
        run: make test-markdown-format
      - name: Format
        run: make check-fmt
      - name: Prepare Whitaker cache directory
        # Compatibility workaround for whitaker-installer 0.2.7. It decides
        # between cloning and pulling on directory existence alone, and the
        # cache volume creates `~/.local/share/whitaker` even on a cold run,
        # so the installer runs `git pull` in a directory that is not yet a
        # repository. Remove the empty mount point and let it clone. Delete
        # this step once the installer checks for a repository rather than a
        # directory.
        run: |
          set -euo pipefail
          whitaker_data="${HOME}/.local/share/whitaker"
          if [[ -d "${whitaker_data}" ]] \
            && ! git -C "${whitaker_data}" rev-parse --git-dir >/dev/null 2>&1; then
            echo "removing non-repository Whitaker data directory"
            rm --recursive --force "${whitaker_data}"
          fi
      - name: Install Whitaker
        uses: >-
          leynos/shared-actions/.github/actions/install-whitaker@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          installer-version: '0.2.7'
          # The Namespace cache volume owns `~/.cargo/bin` and
          # `~/.local/share/whitaker`, so the action must not mount a second
          # owner for the same paths.
          cache-provider: external
      - name: Lint
        run: /usr/bin/make ACTIONLINT="$GITHUB_WORKSPACE/actionlint" lint
      - name: Typecheck
        run: make typecheck
      - name: Doc coverage
        # Rustdoc doc-comment coverage across every workspace lib and bin
        # target, gated on the 80% threshold stated in AGENTS.md. Runs after
        # `make lint` so it reuses the freshly built doc database.
        run: make doc-coverage
      - name: Spelling
        run: make spelling
      - name: Validate Mermaid diagrams
        run: make nixie
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test
        run: make test
      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats --stats-format=json
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          language: rust
          output-path: lcov.info
          format: lcov
          cache-provider: external
          # Compare changed-line coverage against the baseline written by
          # coverage-main.yml (caches saved on main are readable by every PR).
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          path: lcov.info
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/69281
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

  windows:
    # The Windows merge gates live in a reusable workflow so this file stays
    # inside the repository's 400-line limit. Version pins stay here, so the
    # documented `sed` extraction still finds exactly one of each.
    name: Windows
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    # GitHub does not expose the `env` context to a reusable workflow's
    # inputs, so these literals repeat the workflow-level pins above.
    # tests/workflow_contracts/ci_windows_job_test.py holds them equal.
    with:
      nextest-version: '0.9.133'
      mdtablefix-version: '0.5.0'
      python-baseline: '3.14'

  kani-smoke:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-netsuke
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      CARGO_HOME: ${{ github.workspace }}/.kani-cargo
      KANI_HOME: ${{ github.workspace }}/.kani-home
      RUSTUP_HOME: ${{ github.workspace }}/.kani-rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Kani cache volume
        id: namespace_cache
        # Mounted before every installer so the cold run populates the volume
        # and a warm run finds the front-end, verifier, and toolchain in place.
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547
        with:
          path: |
            .kani-cargo
            .kani-home
            .kani-rustup
      - name: Summarize Kani cache
        if: always()
        run: |
          echo '### Kani cache' >> "$GITHUB_STEP_SUMMARY"
          echo "- cache-hit: ${{ steps.namespace_cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@f9a16065e58324b0714e86c1ebeb8eb4500f1b47
        with:
          toolchain: stable
          cache-provider: external
          # Kani's payloads come from pinned release archives, so this job
          # needs no binary-install helper.
          install-binstall: 'false'
          use-sccache: 'false'
      - name: Install prebuilt Kani
        # Kani ships as two payloads: the Cargo front-end and the verifier
        # bundle. Both come from pinned archives with published checksums, and
        # both live under versioned directories on the cache volume so a
        # version bump in tools/kani/VERSION cannot be satisfied by a stale
        # binary left behind by an earlier run.
        run: |
          set -euo pipefail
          kani_version="$(tr -d '\r\n' < tools/kani/VERSION)"
          test "${kani_version}" = '0.67.0'
          frontend_bin="${CARGO_HOME}/frontend/kani-${kani_version}"
          kani_dir="${KANI_HOME}/kani-${kani_version}"
          mkdir --parents "${frontend_bin}" "${KANI_HOME}" "${RUSTUP_HOME}"
          export PATH="${frontend_bin}:${PATH}"
          echo "${frontend_bin}" >> "$GITHUB_PATH"

          target='x86_64-unknown-linux-gnu'
          quickinstall='https://github.com/cargo-bins/cargo-quickinstall'
          upstream='https://github.com/model-checking/kani'

          if [[ ! -x "${frontend_bin}/cargo-kani" || ! -x "${frontend_bin}/kani" ]]; then
            frontend_name="kani-verifier-${kani_version}-${target}.tar.gz"
            frontend_archive="${RUNNER_TEMP}/${frontend_name}"
            curl --fail --location --proto '=https' --tlsv1.2 \
              "${quickinstall}/releases/download/kani-verifier-${kani_version}/${frontend_name}" \
              --output "${frontend_archive}"
            printf '%s  %s\n' \
              'ed2bafc239b834e14c6b66fc4838e342e3bc0b814e548e72ea30e84f83dc0974' \
              "${frontend_archive}" | sha256sum --check --
            tar --extract --gzip --file "${frontend_archive}" \
              --directory "${frontend_bin}" cargo-kani kani
          fi

          if [[ ! -x "${kani_dir}/bin/kani-driver" ]]; then
            bundle_name="kani-${kani_version}-${target}.tar.gz"
            bundle="${RUNNER_TEMP}/${bundle_name}"
            curl --fail --location --proto '=https' --tlsv1.2 \
              "${upstream}/releases/download/kani-${kani_version}/${bundle_name}" \
              --output "${bundle}"
            printf '%s  %s\n' \
              '3b5f7afd3b51603ee720db7bc1bc4fe46b5a4f5d36daad9939c4b4c658b51ac0' \
              "${bundle}" | sha256sum --check --
            cargo kani setup --use-local-bundle "${bundle}"
          fi
      - name: Kani version check
        run: cargo kani --version | grep --fixed-strings "0.67.0"
      - name: Run Kani harnesses
        run: make kani-ir
