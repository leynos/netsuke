name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  # Single source of truth for the cargo-nextest pin. `make test` runs the
  # non-doctest suite through nextest, so every job that installs it reads
  # this value. Declared once at workflow scope so the documented
  # AGENTS.md `sed` extraction yields exactly one version.
  NEXTEST_VERSION: '0.9.133'
  # Pins for the Python lint and typecheck gates. Make's `?=` assignments
  # yield to the environment, so these values control the versions the `make`
  # targets below run under. tests/workflow_contracts/python_toolchain_sync_test.py
  # holds these equal to the Makefile defaults so CI and local runs cannot
  # drift apart.
  RUFF_VERSION: '0.16.4'
  TY_VERSION: '0.0.74'
  PYTHON_BASELINE: '3.14'
  # `make check-fmt` verifies Markdown formatting through
  # scripts/check-markdown-format.sh, which shells out to mdtablefix. Pin it
  # once so both formatter jobs produce the same canonical output.
  MDTABLEFIX_VERSION: '0.5.0'

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # The tree requires the Polonius borrow checker, which nightly enables by
      # default (see docs/adr-006-adopt-polonius-nightly-toolchain.md), so CI
      # builds with the dated nightly pinned in rust-toolchain.toml.
      NETSUKE_RUST_TOOLCHAIN: nightly-2026-08-23
      WHITAKER_INSTALLER_VERSION: '0.2.7'
      # Real-Ninja integration coverage must not silently skip when a runner
      # image lacks the backend executable.
      NETSUKE_REQUIRE_NINJA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the deferred cs-coverage check step can reach
          # the pull request's merge base once the gate is wired in.
          fetch-depth: 0
      - name: Install test shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gawk

          # Ubuntu exposes awk through an alternatives symlink outside
          # /usr/bin. The capability-backed sandbox probe deliberately cannot
          # follow a symlink that escapes its containing directory, so expose
          # the packaged binary as a regular executable on the job PATH.
          test_shell_bin="${RUNNER_TEMP}/netsuke-test-bin"
          mkdir --parents "${test_shell_bin}"
          install --mode=0755 "$(command -v gawk)" "${test_shell_bin}/awk"
          echo "${test_shell_bin}" >> "${GITHUB_PATH}"
          export PATH="${test_shell_bin}:${PATH}"

          command -v awk
          awk --version
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@8add2d99854a5b77548eae98cca59202e68fefc8
        with:
          toolchain: ${{ env.NETSUKE_RUST_TOOLCHAIN }}
          # Preserve warnings-as-errors through toolchain setup.
          rustflags: -D warnings
      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - name: Show rustc version
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Show Ninja version
        run: ninja --version
      - name: Cache mdtablefix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/mdtablefix
            ~/.cargo/bin/mdtablefix.exe
            ~/.cache/cargo-binstall
          key: mdtablefix-${{ runner.os }}-${{ runner.arch }}-${{ env.MDTABLEFIX_VERSION }}
      - name: Install mdtablefix
        # Required by `make check-fmt`. Keep the cached binary at the pinned
        # version and fall back to Cargo when a prebuilt asset is unavailable.
        run: |
          expected_mdtablefix_version="mdtablefix ${MDTABLEFIX_VERSION}"
          installed_mdtablefix_version=""
          if command -v mdtablefix >/dev/null 2>&1; then
            installed_mdtablefix_version="$(mdtablefix --version 2>/dev/null | tr -d '\r')"
          fi
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "mdtablefix@${MDTABLEFIX_VERSION}"
            else
              echo "cargo-binstall unavailable; building mdtablefix from crates.io"
              cargo install --locked mdtablefix --version "${MDTABLEFIX_VERSION}"
            fi
          fi
          installed_mdtablefix_version="$(mdtablefix --version | tr -d '\r')"
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            echo "expected ${expected_mdtablefix_version}, got ${installed_mdtablefix_version}" >&2
            exit 1
          fi
      - name: Setup uv
        # Installed before the Format step: `make check-fmt` and `make lint`
        # run the uv-driven Ruff, Pylint, df12, and ambrleaks gates.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: ${{ env.PYTHON_BASELINE }}
          # This Rust workspace has no Python dependency manifest. Cache the
          # shared spelling dictionary below rather than a uv cache with no
          # durable dependency key.
          enable-cache: 'false'
      - name: Markdown formatter checker tests
        run: make test-markdown-format
      - name: Format
        run: make check-fmt
      - name: Cache Whitaker installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Doc coverage
        # Rustdoc doc-comment coverage across every workspace lib and bin
        # target, gated on the 80% threshold stated in AGENTS.md. Runs after
        # `make lint` so it reuses the freshly built doc database.
        run: make doc-coverage
      - name: Cache shared spelling dictionary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .typos-oxendict-base.json
            .typos-oxendict-base.toml
          key: oxendict-${{ runner.os }}-${{ env.NETSUKE_RUST_TOOLCHAIN }}-${{ hashFiles('typos.local.toml') }}-${{ github.run_id }}
          restore-keys: |
            oxendict-${{ runner.os }}-${{ env.NETSUKE_RUST_TOOLCHAIN }}-${{ hashFiles('typos.local.toml') }}-
      - name: Spelling
        run: make spelling
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test
        run: make test
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@8add2d99854a5b77548eae98cca59202e68fefc8
        with:
          language: rust
          output-path: lcov.info
          format: lcov
          # Compare changed-line coverage against the baseline written by
          # coverage-main.yml (caches saved on main are readable by every PR).
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@8add2d99854a5b77548eae98cca59202e68fefc8
        with:
          path: lcov.info
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/69281
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

  build-test-windows:
    # Gates merges: the `#[cfg(windows)]` tree is compiled, linted, and tested
    # under `-D warnings` on this platform (see #518).
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # The tree requires the Polonius borrow checker, which nightly enables by
      # default (see docs/adr-006-adopt-polonius-nightly-toolchain.md), so CI
      # builds with the dated nightly pinned in rust-toolchain.toml.
      NETSUKE_RUST_TOOLCHAIN: nightly-2026-08-23
      WHITAKER_INSTALLER_VERSION: '0.2.7'
    defaults:
      run:
        # The Makefile uses POSIX shell constructs throughout; Git Bash is
        # preinstalled on windows-latest. GNU Make's default recipe shell on
        # Windows is cmd.exe, so every make invocation overrides SHELL to bash.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install GNU Make
        run: choco install make --yes --no-progress
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@8add2d99854a5b77548eae98cca59202e68fefc8
        with:
          toolchain: ${{ env.NETSUKE_RUST_TOOLCHAIN }}
          # Preserve warnings-as-errors through toolchain setup.
          rustflags: -D warnings
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67  # v6
      - name: Install cargo-nextest
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68  # v2.85.3
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - name: Show rustc version
        run: |
          rustup show
          rustc --version
          cargo --version
      - name: Show Ninja version
        run: ninja --version
      - name: Cache mdtablefix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/mdtablefix
            ~/.cargo/bin/mdtablefix.exe
            ~/.cache/cargo-binstall
          key: mdtablefix-${{ runner.os }}-${{ runner.arch }}-${{ env.MDTABLEFIX_VERSION }}
      - name: Install mdtablefix
        # Required by `make check-fmt`. Keep the cached binary at the pinned
        # version and fall back to Cargo when a prebuilt asset is unavailable.
        run: |
          expected_mdtablefix_version="mdtablefix ${MDTABLEFIX_VERSION}"
          installed_mdtablefix_version=""
          if command -v mdtablefix >/dev/null 2>&1; then
            installed_mdtablefix_version="$(mdtablefix --version 2>/dev/null | tr -d '\r')"
          fi
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "mdtablefix@${MDTABLEFIX_VERSION}"
            else
              echo "cargo-binstall unavailable; building mdtablefix from crates.io"
              cargo install --locked mdtablefix --version "${MDTABLEFIX_VERSION}"
            fi
          fi
          installed_mdtablefix_version="$(mdtablefix --version | tr -d '\r')"
          if [[ "${installed_mdtablefix_version}" != "${expected_mdtablefix_version}" ]]; then
            echo "expected ${expected_mdtablefix_version}, got ${installed_mdtablefix_version}" >&2
            exit 1
          fi
      - name: Setup uv
        # `make check-fmt` runs the uv-driven Ruff format check on every
        # platform, so the Windows job needs uv on the PATH as well.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: ${{ env.PYTHON_BASELINE }}
          enable-cache: 'false'
      - name: Format
        run: make SHELL=bash check-fmt
      - name: Lint (Clippy)
        # Clippy and `cargo doc` over the whole workspace under `-D warnings`,
        # including the `#[cfg(windows)]` arms.
        run: make SHELL=bash lint-clippy
      - name: Cache Whitaker installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        # Installs and runs on windows-latest (verified in #562); the same
        # binstall-with-cargo-install-fallback path as the Linux job. On
        # Windows the installer ships `whitaker` as a PowerShell wrapper
        # (.ps1), which Git Bash cannot execute, so shim `whitaker` in the
        # cargo bin directory (already on PATH) to run the wrapper through
        # PowerShell. A failure here blocks the merge.
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer
          if [ -f "${HOME}/.local/bin/whitaker.ps1" ]; then
            printf '%s\n' \
              '#!/bin/bash' \
              "exec powershell -NoProfile -ExecutionPolicy Bypass -File \"\${HOME}/.local/bin/whitaker.ps1\" \"\$@\"" \
              > "${CARGO_HOME:-$HOME/.cargo}/bin/whitaker"
            chmod +x "${CARGO_HOME:-$HOME/.cargo}/bin/whitaker"
          fi
      - name: Lint (Whitaker)
        # Whitaker/Dylint over the workspace under `-D warnings`, including
        # the `#[cfg(windows)]` arms. A failure blocks the merge.
        run: make SHELL=bash lint-whitaker
      - name: Test
        # cargo-nextest plus doctests under `-D warnings`,
        # compiling and running the `#[cfg(windows)]` test tree. A failure
        # blocks the merge.
        run: make SHELL=bash test

  kani-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      CARGO_HOME: ${{ github.workspace }}/.kani-cargo
      KANI_HOME: ${{ github.workspace }}/.kani-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@8add2d99854a5b77548eae98cca59202e68fefc8
        with:
          toolchain: stable
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          # The Kani job has no Python dependency manifest; its explicit cache
          # below owns the Rust toolchain artefacts.
          enable-cache: false
      - name: Cache Kani tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .kani-cargo
            .kani-home
          key: ${{ runner.os }}-kani-${{ hashFiles('tools/kani/VERSION', 'Makefile') }}
      - name: Install Kani
        run: make install-kani
      - name: Kani version check
        run: make kani-check
      - name: Run Kani harnesses
        run: make kani-ir
