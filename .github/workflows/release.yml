---
name: Release Binary

'on':
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      publish:
        description: >-
          Whether the workflow should publish artefacts to the GitHub release
          associated with the tag. Defaults to `false` when invoked as a
          reusable workflow.
        required: false
        type: boolean
        default: false
      dry-run:
        description: >-
          When `true`, build artefacts without uploading them to GitHub
          releases or workflow artefacts.
        required: false
        type: boolean
        default: false
      wix-extension-version:
        description: >-
          Version of the WixToolset.UI.wixext extension to install alongside
          the WiX CLI.
        required: false
        type: string
        default: '7'
    outputs:
      bin_name:
        description: Binary name extracted from Cargo.toml
        value: ${{ jobs.metadata.outputs.bin_name }}
      version:
        description: Crate version resolved from Cargo.toml
        value: ${{ jobs.metadata.outputs.version }}
      should_publish:
        description: Whether artefacts should be published to the release
        value: ${{ jobs.metadata.outputs.should_publish }}
      dry_run:
        description: Whether the workflow is running in dry-run mode
        value: ${{ jobs.metadata.outputs.dry_run }}
      should_upload_workflow_artifacts:
        description: Whether workflow artefact uploads are enabled
        value: ${{ jobs.metadata.outputs.should_upload_workflow_artifacts }}
      wix_extension_version:
        description: >-
          Resolved WixToolset.UI.wixext version compatible with the configured
          WiX CLI toolchain
        value: ${{ jobs.metadata.outputs.wix_extension_version }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    # API-bound administrative work: it reads Cargo metadata and resolves
    # release modes. There is nothing for a build runner to accelerate, so it
    # stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ensure_version.outputs['crate-version'] }}
      bin_name: ${{ steps.bin_name.outputs['bin-name'] }}
      should_publish: ${{ steps.release_modes.outputs['should-publish'] }}
      dry_run: ${{ steps.release_modes.outputs['dry-run'] }}
      should_upload_workflow_artifacts: ${{ steps.release_modes.outputs['should-upload-workflow-artifacts'] }}
      wix_extension_version: ${{ steps.wix_extension_version.outputs.value }}
      repo_name: ${{ steps.repo_name.outputs.value }}
    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - id: repo_name
        name: Determine repository name
        run: echo "value=${GITHUB_REPOSITORY#*/}" >>"$GITHUB_OUTPUT"
      - id: release_modes
        name: Determine release modes
        uses: >-
          leynos/shared-actions/.github/actions/determine-release-modes@e041cb75c35c3524201a32d5e57c87408fbd5874
      - id: ensure_version
        name: Read package version from Cargo.toml
        uses: >-
          leynos/shared-actions/.github/actions/ensure-cargo-version@e041cb75c35c3524201a32d5e57c87408fbd5874
        with:
          check-tag: ${{ fromJSON(steps.release_modes.outputs['should-publish']) }}
      - id: wix_extension_version
        name: Resolve WiX extension version
        shell: bash
        run: |
          set -euo pipefail
          version=''
          if [ "${{ github.event_name }}" = 'workflow_call' ]; then
            version="$(jq -r '.inputs["wix-extension-version"] // empty' \
              "$GITHUB_EVENT_PATH")"
          fi
          if [ -z "$version" ] || [ "$version" = 'null' ]; then
            version='7'
          fi
          echo "value=$version" >>"$GITHUB_OUTPUT"
      - id: manifest_path
        name: Resolve Cargo manifest path
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="${CARGO_TOML_PATH:-Cargo.toml}"
          echo "value=$manifest_path" >>"$GITHUB_OUTPUT"
      - id: bin_name
        name: Extract binary name from Cargo.toml
        uses: >-
          leynos/shared-actions/.github/actions/export-cargo-metadata@e041cb75c35c3524201a32d5e57c87408fbd5874
        with:
          manifest-path: ${{ steps.manifest_path.outputs.value }}
          fields: bin-name
          export-to-env: 'false'

  build-linux:
    needs: metadata
    # build-and-package.yml compiles, packages, and uploads workflow artefacts
    # through pinned actions. None of them publishes a package or exchanges an
    # OIDC token, so the called workflow needs no write scope.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artefact: linux-amd64
            package_arch: amd64
            target_key: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            artefact: linux-arm64
            package_arch: arm64
            target_key: linux-aarch64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: linux
      # Both Linux targets cross-compile from the x64 shape, as they did
      # before. Start at the recipe's default and escalate only with
      # measurements from three warm runs.
      runner: ubicloud-standard-2-ubuntu-2404
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-${{ matrix.artefact }}
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      package-arch: ${{ matrix.package_arch }}
      stage-target: ${{ matrix.target_key }}

  build-windows:
    needs: metadata
    # build-and-package.yml compiles, packages, and uploads workflow artefacts
    # through pinned actions. None of them publishes a package or exchanges an
    # OIDC token, so the called workflow needs no write scope.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            package_arch: amd64
            msi_arch: x64
            target_key: windows-x86_64
          - target: aarch64-pc-windows-msvc
            package_arch: arm64
            msi_arch: arm64
            target_key: windows-aarch64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: windows
      # Ubicloud offers Linux runners only.
      runner: windows-latest
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-windows-${{ matrix.package_arch }}
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      stage-target: ${{ matrix.target_key }}
      msi-arch: ${{ matrix.msi_arch }}
      wix-extension-version: ${{ needs.metadata.outputs.wix_extension_version }}

  build-macos:
    needs: metadata
    # build-and-package.yml compiles, packages, and uploads workflow artefacts
    # through pinned actions. None of them publishes a package or exchanges an
    # OIDC token, so the called workflow needs no write scope.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artefact_suffix: macos-x86_64
            target_key: macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            artefact_suffix: macos-arm64
            target_key: macos-aarch64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: macos
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-${{ matrix.artefact_suffix }}
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      stage-target: ${{ matrix.target_key }}
      artifact-suffix: ${{ matrix.artefact_suffix }}

  windows-native-recipe-smoke:
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      NETSUKE_RUST_TOOLCHAIN: nightly-2026-08-23
      # The GitHub-hosted `windows-latest` standard runner has four vCPUs.
      WINDOWS_LANE_VCPUS: '4'
      CARGO_BUILD_JOBS: '4'
      RUSTC_WRAPPER: sccache
      # Local directory, matching the Windows gate: the GitHub Actions backend
      # rate-limited every write on this platform.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 4G
    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          persist-credentials: false
      - name: Restore gate caches
        # Restore only. `build-test-windows` in ci-windows.yml is the single
        # writer for both Windows key families; a tag run reads the trunk
        # generation by prefix and publishes nothing.
        uses: ./.github/actions/windows-gate-cache
        with:
          toolchain: ${{ env.NETSUKE_RUST_TOOLCHAIN }}
          mode: restore
          profile: smoke
      - name: Install sccache
        uses: >-
          taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68
        # v2.85.3
        with:
          tool: sccache@0.16.0
          fallback: none
      - name: Setup Rust
        uses: >-
          leynos/shared-actions/.github/actions/setup-rust@e041cb75c35c3524201a32d5e57c87408fbd5874
        with:
          toolchain: ${{ env.NETSUKE_RUST_TOOLCHAIN }}
          rustflags: -D warnings
          cache-provider: external
          use-sccache: 'false'
      - name: Install Ninja
        uses: >-
          seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67
        # v6
      - name: Reset sccache statistics
        run: sccache --zero-stats
      - name: Build Netsuke
        run: cargo build --locked --bin netsuke
      - name: Exercise native Windows recipes
        run: >-
          ./scripts/windows-recipe-smoke.ps1
          -Netsuke ./target/debug/netsuke.exe
          -Manifest ./tests/data/windows-recipe-smoke.yml
      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats --stats-format=json

  release:
    if: needs.metadata.outputs.should_publish == 'true'
    permissions:
      contents: write
    needs:
      - metadata
      - build-linux
      - build-windows
      - build-macos
      - windows-native-recipe-smoke
    # Publication is API-bound: it downloads artefacts and calls the releases
    # API, so a GitHub-hosted runner is the right placement.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - name: Ensure release exists (draft)
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --draft \
              --verify-tag \
              --notes "Automated release for ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # v8.0.1
        with:
          path: dist
          pattern: ${{ needs.metadata.outputs.repo_name }}-*
      - name: Install uv
        # Pins the interpreter the hoist script runs under to the Python 3.14
        # baseline the repository's Python tooling targets, rather than
        # whichever `python3` the runner image happens to ship.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        # v8.3.2
        with:
          python-version: '3.14'
          # The hoist script is stdlib-only and runs with --no-project, so a
          # restored cache buys nothing while feeding a supply-chain input to
          # a job holding contents: write.
          enable-cache: false
      - name: Hoist cargo-binstall archives to the release root
        shell: bash
        # Validates that every target listed in release-staging.toml staged
        # its archive and checksum sidecar, then moves the pairs to dist/ so
        # they upload under the plain names the binstall metadata resolves.
        # A missing target or sidecar fails the release with the names listed.
        run: |
          set -euo pipefail
          uv run --no-project --python 3.14 \
            scripts/hoist_binstall_archives.py \
            --version '${{ needs.metadata.outputs.version }}'
      - id: upload_assets
        name: Upload artefacts to release
        uses: >-
          leynos/shared-actions/.github/actions/upload-release-assets@e041cb75c35c3524201a32d5e57c87408fbd5874
        with:
          release-tag: ${{ github.ref_name }}
          bin-name: ${{ needs.metadata.outputs.bin_name }}
          dist-dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check asset upload errors
        if: steps.upload_assets.outputs.upload-error == 'true'
        run: |
          echo "Error uploading release assets:"
          printf '%s\n' "${{ steps.upload_assets.outputs.error-message }}"
          exit 1
