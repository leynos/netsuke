---
name: Release Binary

'on':
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      publish:
        description: >-
          Whether the workflow should publish artefacts to the GitHub release
          associated with the tag. Defaults to `false` when invoked as a
          reusable workflow.
        required: false
        type: boolean
        default: false
      dry-run:
        description: >-
          When `true`, build artefacts without uploading them to GitHub
          releases or workflow artefacts.
        required: false
        type: boolean
        default: false
      wix-extension-version:
        description: >-
          Version of the WixToolset.UI.wixext extension to install alongside
          the WiX CLI.
        required: false
        type: string
        default: '7'
    outputs:
      bin_name:
        description: Binary name extracted from Cargo.toml
        value: ${{ jobs.metadata.outputs.bin_name }}
      version:
        description: Crate version resolved from Cargo.toml
        value: ${{ jobs.metadata.outputs.version }}
      should_publish:
        description: Whether artefacts should be published to the release
        value: ${{ jobs.metadata.outputs.should_publish }}
      dry_run:
        description: Whether the workflow is running in dry-run mode
        value: ${{ jobs.metadata.outputs.dry_run }}
      should_upload_workflow_artifacts:
        description: Whether workflow artefact uploads are enabled
        value: ${{ jobs.metadata.outputs.should_upload_workflow_artifacts }}
      wix_extension_version:
        description: >-
          Resolved WixToolset.UI.wixext version compatible with the configured
          WiX CLI toolchain
        value: ${{ jobs.metadata.outputs.wix_extension_version }}

# A release never cancels a run in progress: a second push of the same tag
# would otherwise abandon a half-published release. It queues instead. The
# queue holds one pending run (GitHub's default `queue: single`), so a third
# push of the tag replaces the second while it waits; the newest push is the
# one to publish, so that is wanted. A superseded dry run is still cancelled,
# because release-dry-run.yml's own group cancels the whole caller run, this
# called workflow included.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    # API-bound administrative work: it reads Cargo metadata and resolves
    # release modes. There is nothing for a build runner to accelerate, so it
    # stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ensure_version.outputs['crate-version'] }}
      bin_name: ${{ steps.bin_name.outputs['bin-name'] }}
      package_maintainer: ${{ steps.package_metadata.outputs.maintainer }}
      package_homepage: ${{ steps.package_metadata.outputs.homepage }}
      package_license: ${{ steps.package_metadata.outputs.license }}
      package_description: ${{ steps.package_metadata.outputs.description }}
      package_manifest: ${{ steps.manifest_path.outputs.value }}
      should_publish: ${{ steps.release_modes.outputs['should-publish'] }}
      dry_run: ${{ steps.release_modes.outputs['dry-run'] }}
      should_upload_workflow_artifacts: ${{ steps.release_modes.outputs['should-upload-workflow-artifacts'] }}
      wix_extension_version: ${{ steps.wix_extension_version.outputs.value }}
      repo_name: ${{ steps.repo_name.outputs.value }}
    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.14'
          enable-cache: false
      - id: repo_name
        name: Determine repository name
        run: echo "value=${GITHUB_REPOSITORY#*/}" >>"$GITHUB_OUTPUT"
      - id: release_modes
        name: Determine release modes
        uses: >-
          leynos/shared-actions/.github/actions/determine-release-modes@2f58fab140cc8dfe69756aaa6a3bbb987c426023
      - id: ensure_version
        name: Read package version from Cargo.toml
        uses: >-
          leynos/shared-actions/.github/actions/ensure-cargo-version@ff1dd759dfffc0db3459e30e833f52437ee62b57
        with:
          check-tag: ${{ fromJSON(steps.release_modes.outputs['should-publish']) }}
      - id: wix_extension_version
        name: Resolve WiX extension version
        shell: bash
        env:
          INPUT_WIX_EXTENSION_VERSION: ${{ inputs.wix-extension-version || '7' }}
        run: uv run --no-project --python 3.14 scripts/resolve_wix_extension_version.py
      - id: manifest_path
        name: Resolve Cargo manifest path
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="${CARGO_TOML_PATH:-Cargo.toml}"
          echo "value=$manifest_path" >>"$GITHUB_OUTPUT"
      - name: Install Python for package metadata
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.14'
          enable-cache: false
      - id: package_metadata
        name: Read Linux package metadata from Cargo.toml
        shell: bash
        env:
          CARGO_MANIFEST_PATH: ${{ steps.manifest_path.outputs.value }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.14 \
            scripts/cargo_package_metadata.py \
            --manifest "$CARGO_MANIFEST_PATH"
      - id: bin_name
        name: Extract binary name from Cargo.toml
        uses: >-
          leynos/shared-actions/.github/actions/export-cargo-metadata@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          manifest-path: ${{ steps.manifest_path.outputs.value }}
          fields: bin-name
          export-to-env: 'false'

  build-linux:
    needs: metadata
    # build-and-package.yml compiles, packages, and uploads workflow artefacts
    # through pinned actions. None of them publishes a package or exchanges an
    # OIDC token, so the called workflow needs no write scope.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artefact: linux-amd64
            package_arch: amd64
            target_key: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            artefact: linux-arm64
            package_arch: arm64
            target_key: linux-aarch64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: linux
      # Both Linux targets cross-compile from the x64 shape, as they did
      # before. Start at the recipe's default and escalate only with
      # measurements from three warm runs.
      runner: ubicloud-standard-2-ubuntu-2404
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      package-manifest: ${{ needs.metadata.outputs.package_manifest }}
      package-maintainer: ${{ needs.metadata.outputs.package_maintainer }}
      package-homepage: ${{ needs.metadata.outputs.package_homepage }}
      package-license: ${{ needs.metadata.outputs.package_license }}
      package-description: ${{ needs.metadata.outputs.package_description }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-${{ matrix.artefact }}
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      package-arch: ${{ matrix.package_arch }}
      stage-target: ${{ matrix.target_key }}

  build-windows:
    needs: metadata
    # build-and-package.yml compiles, packages, and uploads workflow artefacts
    # through pinned actions. None of them publishes a package or exchanges an
    # OIDC token, so the called workflow needs no write scope.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            package_arch: amd64
            msi_arch: x64
            target_key: windows-x86_64
          - target: aarch64-pc-windows-msvc
            package_arch: arm64
            msi_arch: arm64
            target_key: windows-aarch64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: windows
      # Ubicloud offers Linux runners only.
      runner: windows-latest
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-windows-${{ matrix.package_arch }}
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      stage-target: ${{ matrix.target_key }}
      msi-arch: ${{ matrix.msi_arch }}
      wix-extension-version: ${{ needs.metadata.outputs.wix_extension_version }}

  build-macos:
    needs: metadata
    # build-and-package.yml compiles, packages, and uploads workflow artefacts
    # through pinned actions. None of them publishes a package or exchanges an
    # OIDC token, so the called workflow needs no write scope.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artefact_suffix: macos-x86_64
            target_key: macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            artefact_suffix: macos-arm64
            target_key: macos-aarch64
    uses: ./.github/workflows/build-and-package.yml
    with:
      platform: macos
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      bin-name: ${{ needs.metadata.outputs.bin_name }}
      version: ${{ needs.metadata.outputs.version }}
      artifact-name: ${{ needs.metadata.outputs.repo_name }}-${{ matrix.artefact_suffix }}
      should-upload-workflow-artifacts: ${{ fromJSON(needs.metadata.outputs.should_upload_workflow_artifacts) }}
      stage-target: ${{ matrix.target_key }}
      artifact-suffix: ${{ matrix.artefact_suffix }}

  windows-native-recipe-smoke:
    needs: metadata
    # Skipped on a dry run, and only there. The dry run is a pull request's
    # release rehearsal, and that pull request's own `ci.yml` already runs this
    # exact build and smoke in `build-test-windows` (ci-windows.yml). Running
    # it twice buys no evidence and takes a GitHub-hosted runner from the
    # account's concurrent pool that the gating Windows job and the dry run's
    # own Windows and macOS builds queue for. A tagged release has no gate
    # build to share, so it runs here, and `release` below needs it.
    # tests/workflow_contracts/release_dry_run_smoke_test.py holds all three
    # halves.
    #
    # The one dry-run event CI does not also answer is `ready_for_review`:
    # `ci.yml` runs on opened, synchronize and reopened only. A draft marked
    # ready after its base moved gets a new merge ref and no CI run, so the
    # smoke runs for that event rather than be skipped with nothing covering
    # it.
    if: needs.metadata.outputs.dry_run != 'true' || github.event.action == 'ready_for_review'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      NETSUKE_RUST_TOOLCHAIN: nightly-2026-08-23
      # The GitHub-hosted `windows-latest` standard runner has four vCPUs.
      WINDOWS_LANE_VCPUS: '4'
      CARGO_BUILD_JOBS: '4'
      RUSTC_WRAPPER: sccache
      # Local directory, matching the Windows gate: the GitHub Actions backend
      # rate-limited every write on this platform.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 4G
    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          persist-credentials: false
      - name: Restore gate caches
        # Restore only. `build-test-windows` in ci-windows.yml is the single
        # writer for both Windows key families; a tag run reads the trunk
        # generation by prefix and publishes nothing.
        uses: ./.github/actions/windows-gate-cache
        with:
          toolchain: ${{ env.NETSUKE_RUST_TOOLCHAIN }}
          mode: restore
          profile: smoke
      - name: Install sccache
        uses: >-
          taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: sccache@0.16.0
          fallback: none
      - name: Setup Rust
        uses: >-
          leynos/shared-actions/.github/actions/setup-rust@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        with:
          toolchain: ${{ env.NETSUKE_RUST_TOOLCHAIN }}
          rustflags: -D warnings
          cache-provider: external
          use-sccache: 'false'
      - name: Install Ninja
        uses: >-
          seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67
        # v6
      - name: Reset sccache statistics
        run: sccache --zero-stats
      - name: Build Netsuke
        run: cargo build --locked --bin netsuke
      - name: Exercise native Windows recipes
        run: >-
          ./scripts/windows-recipe-smoke.ps1
          -Netsuke ./target/debug/netsuke.exe
          -Manifest ./tests/data/windows-recipe-smoke.yml
      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats --stats-format=json

  release-admission-canaries:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python for admission timings
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.14'
          enable-cache: false
      - id: release_admission
        name: Require release-admission evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETSUKE_RELEASE_ADMISSION_ENFORCE: 'false'
          NETSUKE_RELEASE_ADMISSION_METRICS_FILE: >-
            ${{ runner.temp }}/release-admission-metrics.jsonl
          NETSUKE_RELEASE_ADMISSION_TRACE_FILE: >-
            ${{ runner.temp }}/release-admission-traces.jsonl
        run: bash .github/scripts/require-release-admission-canaries.sh
      - name: Summarise release-admission metrics
        if: always()
        shell: bash
        env:
          RELEASE_ADMISSION_GATE_OUTCOME: ${{ steps.release_admission.outputs.gate-outcome }}
          RELEASE_ADMISSION_ERROR_CATEGORY: ${{ steps.release_admission.outputs.gate-error-category }}
        run: |
          {
            echo '## Release-admission gate'
            echo
            echo "- Outcome: \`$RELEASE_ADMISSION_GATE_OUTCOME\`"
            echo "- Error category: \`$RELEASE_ADMISSION_ERROR_CATEGORY\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload release-admission metrics
        if: >-
          always() && needs.metadata.outputs.should_upload_workflow_artifacts == 'true'
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        env:
          NETSUKE_RELEASE_ADMISSION_METRICS_FILE: >-
            ${{ runner.temp }}/release-admission-metrics.jsonl
        with:
          name: release-admission-metrics
          path: ${{ env.NETSUKE_RELEASE_ADMISSION_METRICS_FILE }}
          if-no-files-found: error
      - name: Upload release-admission traces
        if: >-
          always() && needs.metadata.outputs.should_upload_workflow_artifacts == 'true'
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        env:
          NETSUKE_RELEASE_ADMISSION_TRACE_FILE: >-
            ${{ runner.temp }}/release-admission-traces.jsonl
        with:
          name: release-admission-traces
          path: ${{ env.NETSUKE_RELEASE_ADMISSION_TRACE_FILE }}
          if-no-files-found: error

  release:
    if: needs.metadata.outputs.should_publish == 'true'
    permissions:
      contents: write
    needs:
      - metadata
      - build-linux
      - build-windows
      - build-macos
      - windows-native-recipe-smoke
    # Publication is API-bound: it downloads artefacts and calls the releases
    # API, so a GitHub-hosted runner is the right placement.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - name: Install uv
        # The privileged job runs inline-metadata Python scripts without a
        # shared dependency cache.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Ensure release exists (draft)
        shell: bash
        env:
          INPUT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-project --python 3.14 scripts/ensure_draft_release.py
      - uses: >-
          actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # v8.0.1
        with:
          path: dist
          pattern: ${{ needs.metadata.outputs.repo_name }}-*
      - name: Hoist cargo-binstall archives to the release root
        shell: bash
        # Validates that every target listed in release-staging.toml staged
        # its archive and checksum sidecar, then moves the pairs to dist/ so
        # they upload under the plain names the binstall metadata resolves.
        # A missing target or sidecar fails the release with the names listed.
        run: |
          set -euo pipefail
          uv run --no-project --python 3.14 scripts/hoist_binstall_archives.py
        env:
          INPUT_VERSION: ${{ needs.metadata.outputs.version }}
      - id: upload_assets
        name: Upload artefacts to release
        uses: >-
          leynos/shared-actions/.github/actions/upload-release-assets@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          release-tag: ${{ github.ref_name }}
          bin-name: ${{ needs.metadata.outputs.bin_name }}
          dist-dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check asset upload errors
        if: steps.upload_assets.outputs.upload-error == 'true'
        env:
          ERROR_MESSAGE: ${{ steps.upload_assets.outputs.error-message }}
        run: |
          echo "Error uploading release assets:"
          printf '%s\n' "$ERROR_MESSAGE"
          exit 1
