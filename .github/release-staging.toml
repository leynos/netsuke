[common]
bin_name = "netsuke"
dist_dir = "dist"
checksum_algorithm = "sha256"
staging_dir_template = "{bin_name}_{platform}_{arch}"

# Stage a `{package_name}-{version}-{target}.tar.gz` archive (plus `.sha256`
# sidecar) for every target. `release.yml` hoists these to the release root so
# the `[package.metadata.binstall]` template in Cargo.toml resolves them;
# `tests/binstall_metadata_tests.rs` holds the three files to that contract.
[common.binstall]
enabled = true

[[common.artefacts]]
source = "target/{target}/release/{bin_name}{bin_ext}"
output = "binary_path"
required = true

[[common.artefacts]]
source = "LICENSE"
destination = "LICENSE"
output = "license_path"
required = true

# These files are generated by build.rs from Cli::command(), so each released
# archive carries completion data that matches the binary it contains.
[[common.artefacts]]
source = "target/generated-completions/{target}/release/netsuke.bash"
destination = "completions/bash/netsuke"
required = true

[[common.artefacts]]
source = "target/generated-completions/{target}/release/netsuke.elv"
destination = "completions/elvish/netsuke.elv"
required = true

[[common.artefacts]]
source = "target/generated-completions/{target}/release/netsuke.fish"
destination = "completions/fish/netsuke.fish"
required = true

[[common.artefacts]]
source = "target/generated-completions/{target}/release/_netsuke.ps1"
destination = "completions/powershell/_netsuke.ps1"
required = true

[[common.artefacts]]
source = "target/generated-completions/{target}/release/_netsuke"
destination = "completions/zsh/_netsuke"
required = true

[targets.linux-x86_64]
platform = "linux"
arch = "x86_64"
target = "x86_64-unknown-linux-gnu"

[[targets.linux-x86_64.artefacts]]
source = "target/orthohelp/{target}/release/man/man1/{bin_name}.1"
destination = "man/man1/{bin_name}.1"
output = "man_path"
required = true

[targets.linux-aarch64]
platform = "linux"
arch = "aarch64"
target = "aarch64-unknown-linux-gnu"

[[targets.linux-aarch64.artefacts]]
source = "target/orthohelp/{target}/release/man/man1/{bin_name}.1"
destination = "man/man1/{bin_name}.1"
output = "man_path"
required = true

[targets.windows-x86_64]
platform = "windows"
arch = "x86_64"
target = "x86_64-pc-windows-msvc"
bin_ext = ".exe"

[[targets.windows-x86_64.artefacts]]
source = "target/orthohelp/{target}/release/powershell/Netsuke/Netsuke.psm1"
destination = "Netsuke/Netsuke.psm1"
required = false

[[targets.windows-x86_64.artefacts]]
source = "target/orthohelp/{target}/release/powershell/Netsuke/Netsuke.psd1"
destination = "Netsuke/Netsuke.psd1"
required = true

[[targets.windows-x86_64.artefacts]]
source = "target/orthohelp/{target}/release/powershell/Netsuke/en-US/Netsuke-help.xml"
destination = "Netsuke/en-US/Netsuke-help.xml"
required = true

[[targets.windows-x86_64.artefacts]]
source = "target/orthohelp/{target}/release/powershell/Netsuke/en-US/about_Netsuke.help.txt"
destination = "Netsuke/en-US/about_Netsuke.help.txt"
required = true

[targets.windows-aarch64]
platform = "windows"
arch = "aarch64"
target = "aarch64-pc-windows-msvc"
bin_ext = ".exe"

[[targets.windows-aarch64.artefacts]]
source = "target/orthohelp/{target}/release/powershell/Netsuke/Netsuke.psm1"
destination = "Netsuke/Netsuke.psm1"
required = false

[[targets.windows-aarch64.artefacts]]
source = "target/orthohelp/{target}/release/powershell/Netsuke/Netsuke.psd1"
destination = "Netsuke/Netsuke.psd1"
required = true

[[targets.windows-aarch64.artefacts]]
source = "target/orthohelp/{target}/release/powershell/Netsuke/en-US/Netsuke-help.xml"
destination = "Netsuke/en-US/Netsuke-help.xml"
required = true

[[targets.windows-aarch64.artefacts]]
source = "target/orthohelp/{target}/release/powershell/Netsuke/en-US/about_Netsuke.help.txt"
destination = "Netsuke/en-US/about_Netsuke.help.txt"
required = true

[targets.macos-x86_64]
platform = "macos"
arch = "x86_64"
target = "x86_64-apple-darwin"

[[targets.macos-x86_64.artefacts]]
source = "target/orthohelp/{target}/release/man/man1/{bin_name}.1"
destination = "man/man1/{bin_name}.1"
output = "man_path"
required = true

[targets.macos-aarch64]
platform = "macos"
arch = "aarch64"
target = "aarch64-apple-darwin"

[[targets.macos-aarch64.artefacts]]
source = "target/orthohelp/{target}/release/man/man1/{bin_name}.1"
destination = "man/man1/{bin_name}.1"
