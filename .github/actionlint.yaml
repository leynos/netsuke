# Runner labels this repository intends to use. actionlint rejects any other
# label, so a typo or an unreviewed shape fails the lint gate rather than
# queueing forever. Only Linux labels appear here: Ubicloud offers Linux
# runners only, and every Windows and macOS job uses a GitHub-hosted label
# that actionlint already knows.
self-hosted-runner:
  labels:
    - ubicloud-standard-2-ubuntu-2404
    - ubicloud-standard-4-ubuntu-2404
    - ubicloud-standard-2-ubuntu-2204
