# Runner labels this repository intends to use. actionlint rejects any other
# label, so a typo or an unreviewed shape fails the lint gate rather than
# queueing forever. Only Linux labels appear here: Ubicloud offers Linux
# runners only, and every Windows and macOS job uses a GitHub-hosted label
# that actionlint already knows.
self-hosted-runner:
  labels:
    - ubicloud-standard-2-ubuntu-2404
    - ubicloud-standard-4-ubuntu-2404
    - ubicloud-standard-2-ubuntu-2204

# Path-specific exemptions. Each one is a gap in actionlint's vendored context
# types, not a defect in the workflow. An entry filters by file and diagnostic
# text: it silences every diagnostic carrying that message anywhere in the file,
# not one expression. That wider reach is accepted only because the expression
# is held by a workflow contract of its own, so a second use of the property is
# still checked by `release_admission_source_pin` rather than by actionlint.
paths:
  .github/workflows/release.yml:
    ignore:
      # The release admission job checks the gate out at `job.workflow_sha`, the
      # commit of the workflow file that defines the job. GitHub documents that
      # property in the contexts reference; actionlint 1.7.12's schema predates
      # it and reports the property as undefined. The source-pin contract holds
      # the repository, ref, checkout order, and gate step around that
      # expression. The evidence producer, the release-candidate resolver, and
      # the downstream canary jobs pin their checkouts the same way, and
      # `tests/workflow_contracts/release_admission_producer_test.py` holds
      # those uses.
      - 'property "workflow_sha" is not defined in object type'
