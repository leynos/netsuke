repository = "leynos/netsuke"

# The pull-request lane (`ci.yml:build-test`) ratchets against the publisher's
# baseline. The legs differ in three environment keys, none of them an input to
# what is measured:
#   BUILD_JOBS                     the lane's make parallelism, read by its
#                                  build steps
#   PYTHON_BASELINE                the workflow's setup-python version for
#                                  tooling
#   NETSUKE_READ_POLICY_RESOLVER_STRICT
#                                  the pull-request lane installs `strace` and
#                                  requires the manual-resolver harness to run;
#                                  the publisher lane does not guarantee the
#                                  tracer, so it permits a skip rather than
#                                  failing the trunk. The switch decides whether
#                                  one test fails or skips on a missing
#                                  prerequisite; it changes no source the
#                                  measurement counts.
# Both legs read the toolchain from rust-toolchain.toml through the same
# resolve step, so NETSUKE_RUST_TOOLCHAIN no longer differs.
[[pairing]]
lane = "ci.yml:build-test:Test and Measure Coverage"
publisher = "coverage-main.yml:coverage-upload:Test and Measure Coverage"
differs = [
  "BUILD_JOBS",
  "NETSUKE_READ_POLICY_RESOLVER_STRICT",
  "PYTHON_BASELINE",
]
guards = []
