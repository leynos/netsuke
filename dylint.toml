# Whitaker lint configuration.
#
# `no_std_fs_operations` enforces capability-based filesystem access. Where an
# exclusion is genuinely warranted, prefer `excluded_paths` — it exempts one
# module and its descendants — over `excluded_crates`, which exempts an entire
# compilation unit. A crate-level entry is justified only when the ambient
# access lives in the crate root itself, where a path entry would be identical
# to a crate entry. See docs/whitaker-users-guide.md.

# `bumpy_road_function` "descends through generated expressions and measures the
# authored code they wrap". Each `?` expands to a two-arm `match`, so a flat run
# of `?`-bearing calls presents as nested conditional logic, and so does a
# multi-line array literal. `src/graph_view/render/html/mod.rs::write_head`
# carries no `if`, `match`, `else`, or loop at all — eleven straight-line
# `writeln!` calls — and is still reported.
#
# Those artefacts are bounded by the size of the literal they sit in: the widest
# observed spans 18 lines and the rest under 12. A genuine bumpy road sustains a
# nested region over the whole body rather than a fixed-size literal, so it is
# not bounded by one. Requiring a bump to span 15 lines drops every
# generated-expression artefact observed while keeping the rule live for the
# long functions it targets. Measured on `e28f26ae2` with the suite at
# `880939d1f6`: 60 findings across 22 files at the default of 2, 1 at 15.
#
# The weighted `threshold` is left at its default: this narrows the span a peak
# must cover and does not lower the complexity bar.
[bumpy_road_function]
min_bump_lines = 15

# Cognitive complexity is gated here, not by Clippy. Clippy's
# `cognitive_complexity` scores code after macro expansion, so `tracing` macros
# under the `log` bridge inflated it and forced a ceiling of 32. The
# macro-aware lint skips branching a macro generated, so it holds the ceiling
# at CodeScene's 9. It is experimental, so the suite loads it only on request.
# The tracker is https://github.com/leynos/whitaker/issues/504.
[whitaker]
experimental = ["macro_aware_cognitive_complexity"]

[macro_aware_cognitive_complexity]
max_complexity = 9

[no_std_fs_operations]

# Modules that need ambient filesystem access, scoped as narrowly as the lint
# allows. Everything else in these crates stays under the capability policy.
excluded_paths = [
    # Application boundary. `netsuke` probes executables in directories supplied
    # by the ambient PATH and follows cross-directory symlinks when
    # canonicalizing them; `cap_std` refuses symlinks that leave the directory,
    # so these operations cannot be capability-scoped.
    "netsuke::stdlib::which::lookup",
    # Creates the parent directories of executable `phony` edges' declared
    # outputs. Ninja did that itself before the lowering moved an executable
    # `phony` edge's product to a hidden output, and a manifest may declare an
    # output outside the working directory — an absolute path, or a `..`
    # spelling that leaves it — which a capability handle cannot reach. The
    # recipe already runs with full ambient authority, so this grants nothing
    # the build does not hold; scoping the exemption to this one module keeps
    # every other runner path under the policy.
    "netsuke::runner::output_dirs",
    # Syncs the ambient temporary file the runner writes its Ninja file to.
    # `tempfile` creates that file in the ambient system temporary directory, so
    # no directory handle covers it and the open file descriptor is the narrowest
    # authority for `sync_all`. Scoped to the `ambient_sync` submodule that holds
    # only that call, so the rest of `file_io` — which writes through `cap_std`
    # handles — stays under the policy.
    "netsuke::runner::process::file_io::ambient_sync",
    # Canonicalises a caller-supplied `--directory` so it can be compared with
    # the layer paths `ortho_config` records. The comparison must mirror
    # OrthoConfig exactly: `cap_std` rejects aliases that cross a directory
    # boundary, while standard canonicalization resolves them. Whitaker scopes
    # filesystem policy at module boundaries, so this small path-normalization
    # module is the narrowest available exception.
    "netsuke::cli::discovery::paths",
    # Behavioural step definitions that stage scenario fixtures — manifests,
    # workspaces, and captured output — through ambient tempdir access.
    "bdd_tests::bdd::steps::advanced_usage",
    "bdd_tests::bdd::steps::conditional_manifest",
    "bdd_tests::bdd::steps::fs",
    "bdd_tests::bdd::steps::help_targets",
    "bdd_tests::bdd::steps::manifest_command",
    "bdd_tests::bdd::steps::process",
    "bdd_tests::bdd::steps::progress_output",
    "bdd_tests::bdd::steps::stdlib::assertions",
    "bdd_tests::bdd::steps::stdlib::workspace",

    # CLI integration tests that stage configuration files in ambient tempdirs.
    "cli_tests::cli_tests::config_discovery",
    "cli_tests::cli_tests::config_selection",
    "cli_tests::cli_tests::merge",

    # The shared workflow-reading helper (`tests/common/mod.rs`), included by
    # each workflow contract crate. The crates themselves stay under policy.
    "workflow_ci::common",
    "workflow_orthohelp_install::common",
    "workflow_release::common",

    # The build script's parsers, included by path so `cargo test` can reach
    # them (build scripts are not test targets). Each reads a file Cargo hands
    # it through the build script; these entries cover the copies compiled into
    # the test crates. The build script compiles only the parser subset, so it
    # does not include the discovery path normalizer.
    "build_l10n_keys_tests::keys",
    "build_l10n_parser_tests::ftl",
    "build_l10n_audit_rules_tests::ftl",
]

# Whole crates whose ambient filesystem access lives in the crate root, so a
# path entry would be no narrower than a crate entry:
# - integration test crates (tests/*.rs): fixture management writes manifests,
#   workspaces, and captured output with ambient tempdir access, which the
#   Whitaker user's guide lists as a sanctioned exclusion.
#
# Add a new entry here only when the ambient I/O really is at the crate root;
# otherwise add a path above, and prefer migrating to `cap_std` over either.
#
# `test_support` is deliberately absent. It is a workspace member, but its
# sanctioned ambient boundary is configured in `test_support/dylint.toml` and
# loaded by the crate-scoped `make lint-whitaker` pass. That configuration
# narrows the exemption to `test_support::fs` rather than exempting the crate.
excluded_crates = [
    # Stages the audit's inputs into a TempDir and runs the real audit over
    # them and over CARGO_MANIFEST_DIR. Both roots are ambient by
    # construction, and the audit modules it includes by path read files the
    # build script hands them the same way.
    "build_l10n_audit_tests",
    "advanced_usage_tests",
    "assert_cmd_tests",
    "manifest_glob_tests",
    "ninja_snapshot_tests",
    "novice_flow_smoke_tests",
    "prover_tools_kani_check_command_tests",
    "prover_tools_make_tests",
    "prover_tools_verus_e2e_tests",
    "release_help_script_tests",
    "release_help_synopsis_tests",
    "release_staging_tests",
    "runner_graph_tests",
    "runner_help_targets_tests",
    "runner_tests",
    "runner_tool_subcommands_tests",
    "stdlib_which_tests",
    "which_diagnostic_snapshot_tests",
    "workflow_build_and_package",
    "workflow_shared_actions_pins",
]
