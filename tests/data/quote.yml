targets:
  - name: "out file"
    sources: "in file"
    command: "cat {{ ins }} > {{ outs }}"
  - name: "plain-output"
    sources: "-in file"
    command: "printf %s {{ ins }} > {{ outs }}"
  - name: "o'utfile"
    sources: "-in file"
    command: "printf %s {{ ins }} > {{ outs }}"
