netsuke_version: "1.0.0"

actions:
  - name: scalar
    description: Prove the scalar recipe uses Windows PowerShell
    command: "$edition = $PSVersionTable.PSEdition; if ($env:NETSUKE_SMOKE_VALUE -ne 'value with spaces') { exit 71 }; Set-Content -NoNewline -LiteralPath 'scalar interpreter with spaces.txt' -Value $edition"
  - name: dollar-syntax
    description: Preserve ordinary PowerShell dollar variables through Ninja
    command: "$recipeValue = if ($null -eq $env:NETSUKE_SMOKE_OPTION) { 'default value' } else { $env:NETSUKE_SMOKE_OPTION }; Set-Content -NoNewline -LiteralPath 'dollar value.txt' -Value $recipeValue"
  - name: ordered-list
    description: Preserve PowerShell state through a two-entry command list
    command:
      - "$env:NETSUKE_ORDER = 'first'; Set-Content -NoNewline -LiteralPath 'ordered state.txt' -Value $env:NETSUKE_ORDER"
      - "if ($env:NETSUKE_ORDER -ne 'first') { exit 72 }; Add-Content -NoNewline -LiteralPath 'ordered state.txt' -Value ';second'"
  - name: first-list-entry-fails
    description: Stop an ordered command list after its first failing entry
    command:
      - "cmd.exe /d /c exit 27"
      - "Set-Content -NoNewline -LiteralPath 'must not exist.txt' -Value second-entry-ran"
  - name: isolated-state
    description: Reset PowerShell location and variables for every isolated entry
    command_isolation: isolated
    command:
      - "$null = New-Item -ItemType Directory -Force -Path 'isolated nested'; Set-Location 'isolated nested'; $env:NETSUKE_ISOLATED_ENV = 'leaked'; $script:NETSUKE_ISOLATED_VARIABLE = 'leaked'"
      - "if ((Get-Location).Path -ne $env:NETSUKE_ISOLATION_ROOT) { exit 76 }; if ($env:NETSUKE_ISOLATED_ENV) { exit 77 }; if (Get-Variable NETSUKE_ISOLATED_VARIABLE -Scope Script -ErrorAction SilentlyContinue) { exit 78 }; Set-Content -NoNewline -LiteralPath 'isolated state.txt' -Value 'baseline'"
  - name: isolated-exit-zero
    description: Continue after a successful exit in an isolated entry
    command_isolation: isolated
    command:
      - "exit 0"
      - "Set-Content -NoNewline -LiteralPath 'isolated exit zero.txt' -Value continued"
  - name: isolated-list-fails
    description: Stop isolated PowerShell entries after native command failure
    command_isolation: isolated
    command:
      - "cmd.exe /d /c exit 29"
      - "Set-Content -NoNewline -LiteralPath 'isolated must not exist.txt' -Value second-entry-ran"
  - name: isolated-large-list
    description: Use the response file for a large isolated PowerShell list
    command_isolation: isolated
    command:
      - "$largeRecipePadding = '{{ 'x' * 5000 }}'; $env:NETSUKE_ISOLATED_LARGE = 'first'"
      - "$largeRecipePadding = '{{ 'y' * 5000 }}'; if ($env:NETSUKE_ISOLATED_LARGE) { exit 79 }; Set-Content -NoNewline -LiteralPath 'isolated large list.txt' -Value 'second'"
  - name: isolated-native-stderr
    description: Pass native stderr through isolated PowerShell children
    command_isolation: isolated
    command:
      - "cmd.exe /d /c 'echo isolated-native-stderr 1>&2'"
      - "Set-Content -NoNewline -LiteralPath 'isolated stderr.txt' -Value complete"
  - name: isolated-powershell-error
    description: Keep PowerShell cmdlet errors fail-fast in isolated children
    command_isolation: isolated
    command:
      - "Write-Error 'isolated-powershell-error'; Set-Content -NoNewline -LiteralPath 'isolated powershell error.txt' -Value unexpected"
      - "Set-Content -NoNewline -LiteralPath 'isolated powershell error.txt' -Value unexpected"
  - name: script
    description: Prove script recipes use Windows PowerShell
    script: |
      $edition = $PSVersionTable.PSEdition
      Set-Content -NoNewline -LiteralPath 'script interpreter.txt' -Value $edition
  - name: dependency-first
    command: "Set-Content -NoNewline -LiteralPath 'dependency order.txt' -Value first"
  - name: dependency-second
    command: "if ((Get-Content -Raw -LiteralPath 'dependency order.txt') -ne 'first') { exit 73 }; Add-Content -NoNewline -LiteralPath 'dependency order.txt' -Value ';second'"
  - name: aggregate
    description: Run direct dependencies in declaration order
    command: "if ((Get-Content -Raw -LiteralPath 'dependency order.txt') -ne 'first;second') { exit 74 }; Add-Content -NoNewline -LiteralPath 'dependency order.txt' -Value ';aggregate'"
    dependency_order: serial
    deps:
      - dependency-first
      - dependency-second
  - name: bash-isolated-state
    description: Reset POSIX shell state for isolated entries on Windows Bash
    command_isolation: isolated
    command:
      - "mkdir -p nested && cd nested && export NETSUKE_BASH_ENV=leaked && NETSUKE_BASH_VARIABLE=leaked"
      - "test \"$PWD\" = \"$NETSUKE_BASH_BASELINE\" && test -z \"${NETSUKE_BASH_ENV-}\" && test -z \"${NETSUKE_BASH_VARIABLE-}\" && echo isolated > bash-isolated-state.txt"
  - name: large-scalar
    description: Execute a scalar recipe beyond the Windows command-line limit
    command: "$largeRecipePadding = '{{ 'x' * 12500 }}'; Set-Content -NoNewline -LiteralPath 'large scalar.txt' -Value scalar"
  - name: large-script
    description: Execute a script recipe beyond the Windows command-line limit
    script: |
      $largeRecipePadding = '{{ 'x' * 12500 }}'
      Set-Content -NoNewline -LiteralPath 'large script.txt' -Value script
  - name: large-list
    description: Preserve state through an oversized ordered command list
    command:
      - "$largeRecipePadding = '{{ 'x' * 12500 }}'; $env:NETSUKE_LARGE_LIST = 'first'"
      - "if ($env:NETSUKE_LARGE_LIST -ne 'first') { exit 75 }; Set-Content -NoNewline -LiteralPath 'large list.txt' -Value $env:NETSUKE_LARGE_LIST"
  - name: large-list-fails
    description: Stop an oversized ordered command list at its first failure
    command:
      - "$largeRecipePadding = '{{ 'x' * 12500 }}'; cmd.exe /d /c exit 28"
      - "Set-Content -NoNewline -LiteralPath 'large list must not exist.txt' -Value second-entry-ran"

targets:
  - name: automatic path.txt
    description: Discover this target without executing its recipe
    command: "Set-Content -NoNewline -LiteralPath {{ outs }} -Value automatic-path-quoting"
  - name: discovery-must-not-execute.txt
    description: Confirm target discovery has no recipe side effects
    command: "Set-Content -NoNewline -LiteralPath {{ outs }} -Value recipe-should-not-run"
