[package]
name = "netsuke-build-slice-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"
test = false

[lints]
workspace = true

[dependencies]
camino = { version = "1.2.0", features = ["serde1"] }
clap = { version = "4.5.0", features = ["derive"] }
ortho_config = { version = "0.9.0", features = ["serde_json"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
